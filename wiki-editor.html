<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CMRA Wiki Card Editor</title>
<style>
:root{--bg:#f2f2f7;--surface:#fff;--surface-2:#f0f0f5;--border:#d1d1d6;--primary:#2563eb;--primary-dim:#dbeafe;--primary-text:#1d4ed8;--accent:#2c8a3d;--accent-dim:#d4f1dc;--amber:#d97706;--danger:#dc2626;--text:#1c1c1e;--text-dim:#8e8e93;--radius:14px;--radius-sm:10px;--radius-xs:8px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;overflow:hidden}
.auth-gate{display:flex;align-items:center;justify-content:center;height:100vh;padding:24px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:340px;width:100%;text-align:center}
.auth-card h1{font-size:1.2rem;margin-bottom:6px}.auth-card p{font-size:0.85rem;color:var(--text-dim);margin-bottom:16px}
.auth-card input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:0.95rem;font-family:inherit;margin-bottom:10px}
.auth-card input:focus{outline:none;border-color:var(--primary)}.auth-card .err{color:var(--danger);font-size:0.82rem;margin-bottom:8px;min-height:18px}
.app{display:none;height:100vh;flex-direction:row}.app.active{display:flex}
.sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh}
.sidebar-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-header h2{font-size:0.95rem;font-weight:800}
.sidebar-list{flex:1;overflow-y:auto;padding:6px 0}
.sidebar-item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--surface-2);font-size:0.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-item:hover{background:var(--surface-2)}.sidebar-item.active{background:var(--primary-dim);color:var(--primary-text);font-weight:700}
.sidebar-item .sub{font-size:0.72rem;color:var(--text-dim);margin-top:2px;font-weight:400}
.sidebar-empty{padding:20px 16px;color:var(--text-dim);font-size:0.85rem;text-align:center}
.editor{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.editor-header{padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.editor-header h2{font-size:0.95rem;font-weight:700}.editor-body{flex:1;overflow-y:auto;padding:20px}
.editor-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:0.95rem}
.field{margin-bottom:16px}.field label{display:block;font-size:0.78rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:4px}
.field input,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:0.95rem;font-family:inherit;background:var(--surface);color:var(--text)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--primary)}.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.btn{padding:10px 16px;border-radius:var(--radius-sm);font-weight:700;font-size:0.85rem;cursor:pointer;border:none;font-family:inherit}.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}.btn-accent{background:var(--accent);color:#fff}.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}.btn-sm{padding:6px 12px;font-size:0.78rem}.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.img-area{border:2px dashed var(--border);border-radius:var(--radius-sm);min-height:200px;position:relative;overflow:hidden;background:var(--surface-2);margin-bottom:8px}
.img-area.has-image{border-style:solid}
.img-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;cursor:pointer;color:var(--text-dim);font-size:0.85rem;gap:8px}.img-drop span{font-size:2rem}
.crop-viewport{width:100%;height:300px;overflow:hidden;position:relative;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.crop-viewport:active{cursor:grabbing}
.crop-viewport img{position:absolute;user-select:none;-webkit-user-drag:none;transform-origin:0 0;pointer-events:none}
.markup-area{position:relative}
.markup-area canvas{display:block;width:100%;border-radius:var(--radius-xs);touch-action:none;-webkit-user-select:none;user-select:none}
.markup-tools{display:flex;gap:8px;align-items:center;padding:10px 0;flex-wrap:wrap}
.color-swatch{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;flex-shrink:0}
.color-swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--surface)}
.tool-btn{padding:8px 12px;font-size:0.82rem;font-weight:600;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-xs);cursor:pointer;font-family:inherit;min-height:36px}
.tool-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.assign-section{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.assign-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:0.85rem}.assign-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary)}
.preview-section{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.preview-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;max-width:360px}
.preview-card h4{font-weight:800;font-size:0.95rem;margin-bottom:6px}.preview-card p{font-size:0.88rem;color:var(--text-dim);line-height:1.5}.preview-card img{width:100%;display:block}
.save-status{font-size:0.78rem;margin-top:6px;min-height:18px}
.save-status.ok{color:var(--accent)}.save-status.err{color:var(--danger)}
@media(max-width:680px){.sidebar{width:100%;height:auto;max-height:35vh;border-right:none;border-bottom:1px solid var(--border)}.app{flex-direction:column}.markup-tools{gap:6px}.color-swatch{width:32px;height:32px}}
</style>
</head>
<body>
<div class="auth-gate" id="auth-gate"><div class="auth-card"><h1>Wiki Card Editor</h1><p>Create info cards for volunteer waiting rooms.</p><input type="password" id="auth-key" placeholder="Admin key" autocapitalize="off"><div class="err" id="auth-err"></div><button class="btn btn-primary" style="width:100%" onclick="doAuth()">Unlock</button></div></div>
<div class="app" id="app">
<div class="sidebar"><div class="sidebar-header"><h2>Card Library</h2><button class="btn btn-sm btn-primary" onclick="newCard()">+ New</button></div><div class="sidebar-list" id="sidebar-list"><div class="sidebar-empty">No cards yet</div></div></div>
<div class="editor"><div class="editor-header"><h2 id="editor-title">Select a card or create new</h2><div class="btn-row" id="editor-actions" style="display:none"><button class="btn btn-sm btn-ghost" onclick="duplicateCard()">Duplicate</button><button class="btn btn-sm btn-danger" onclick="deleteCard()">Delete</button></div></div>
<div class="editor-body"><div class="editor-empty" id="editor-empty">Select a card from the library or create a new one.</div>
<div id="editor-form" style="display:none">
<div class="field"><label>Title</label><input type="text" id="card-title" placeholder="Card title" maxlength="100"></div>
<div class="field"><label>Body</label><textarea id="card-body" placeholder="Card content" maxlength="500" rows="4"></textarea></div>
<div class="field"><label>Image (optional)</label>
<div class="img-area" id="img-area">
<div class="img-drop" id="img-drop" onclick="document.getElementById('img-input').click()"><span>📷</span><div>Tap to upload</div></div>
<input type="file" id="img-input" accept="image/*" style="display:none" onchange="imageUploaded(this)">
<div id="crop-container" style="display:none"><div class="crop-viewport" id="crop-viewport"><img id="crop-img" draggable="false"></div><div class="btn-row" style="padding:8px"><button class="btn btn-sm btn-primary" onclick="confirmCrop()">Confirm crop</button><button class="btn btn-sm btn-ghost" onclick="clearImage()">Remove</button></div></div>
<div id="markup-container" style="display:none"><div class="markup-area"><canvas id="markup-canvas"></canvas></div>
<div class="markup-tools"><button class="tool-btn active" id="tool-draw" onclick="setTool('draw')">Draw</button><button class="tool-btn" id="tool-text" onclick="setTool('text')">Text</button><button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')">Eraser</button><div style="width:1px;height:28px;background:var(--border);margin:0 2px"></div><div id="color-palette" style="display:flex;gap:6px;flex-wrap:wrap"></div><div style="margin-left:auto" class="btn-row"><button class="btn btn-sm btn-ghost" onclick="undoMarkup()">Undo</button><button class="btn btn-sm btn-ghost" onclick="recrop()">Re-crop</button><button class="btn btn-sm btn-danger" onclick="clearImage()">Remove</button></div></div></div>
</div></div>
<div class="assign-section"><label style="font-size:0.78rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:8px;display:block">Assign to locations</label><div class="assign-row"><input type="checkbox" id="assign-all" onchange="toggleAssignAll()"><label for="assign-all" style="font-weight:700">All locations</label></div><div id="assign-events"></div></div>
<div style="margin-top:20px" class="btn-row"><button class="btn btn-accent" onclick="saveCard()" id="btn-save">Save card</button></div>
<div class="save-status" id="save-status"></div>
<div class="preview-section"><label style="font-size:0.78rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:8px;display:block">Preview</label><div class="preview-card"><div id="preview-dots" style="text-align:center;margin-bottom:8px"></div><h4 id="preview-title">Title</h4><p id="preview-body">Body text</p><div id="preview-img" style="margin-top:8px"></div></div></div>
</div></div></div>
</div>
<script>
var API_URL='https://script.google.com/macros/s/AKfycbxbcHE2mwrnhZHYnLTZwVyPqPfvK3G6ObRtPTtwXQmoVR1s-DVWp479p6bZOOLN5x9eag/exec';
var AUTH={adminKey:null};
var LIBRARY=[];
var ASSIGNMENTS={};
var EVENTS=[];
var ACTIVE_ID=null;
var IMG={raw:null,cropX:0,cropY:0,cropScale:1,croppedData:null,markupHistory:[],tool:'draw',color:'#dc2626',drawing:false};
var COLORS=['#dc2626','#ea580c','#d97706','#16a34a','#2563eb','#7c3aed','#1c1c1e','#ffffff'];

function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':s);return d.innerHTML;}
function $(id){return document.getElementById(id);}
function status(msg,type){$('save-status').textContent=msg;$('save-status').className='save-status '+(type||'');}

function api(action,data){
  var body=Object.assign({action:action,version:'v3'},data||{});
  if(AUTH.adminKey)body.adminKey=AUTH.adminKey;
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(r){if(!r.success)throw new Error(r.error||'API error');return r.data;});
}

function doAuth(){
  var key=$('auth-key').value.trim();
  if(!key){$('auth-err').textContent='Enter admin key';return;}
  AUTH.adminKey=key;
  api('getWikiCards').then(function(d){
    LIBRARY=d.library||[];
    ASSIGNMENTS=d.assignments||{};
    EVENTS=d.events||[];
    $('auth-gate').style.display='none';
    $('app').classList.add('active');
    renderSidebar();
  }).catch(function(e){
    AUTH.adminKey=null;
    $('auth-err').textContent=e.message||'Invalid key';
  });
}

function renderSidebar(){
  var el=$('sidebar-list');
  if(LIBRARY.length===0){el.innerHTML='<div class="sidebar-empty">No cards yet. Tap + New.</div>';return;}
  var h='';
  for(var i=0;i<LIBRARY.length;i++){
    var c=LIBRARY[i];
    var cls='sidebar-item'+(c.id===ACTIVE_ID?' active':'');
    var cnt=countAssignments(c.id);
    var al=cnt.isAll?'All locations':(cnt.n+' location'+(cnt.n===1?'':'s'));
    h+='<div class="'+cls+'" data-id="'+esc(c.id)+'">'+esc(c.title||'Untitled')+'<div class="sub">'+esc(al)+'</div></div>';
  }
  el.innerHTML=h;
  var items=el.querySelectorAll('.sidebar-item');
  for(var i=0;i<items.length;i++){
    items[i].addEventListener('click',function(){selectCard(this.dataset.id);});
  }
}

function countAssignments(cardId){
  var inAll=(ASSIGNMENTS['*']||[]).indexOf(cardId)!==-1;
  if(inAll)return{isAll:true,n:EVENTS.length||1};
  var n=0;for(var k in ASSIGNMENTS){if(k==='*')continue;if((ASSIGNMENTS[k]||[]).indexOf(cardId)!==-1)n++;}
  return{isAll:false,n:n};
}

function newCard(){
  var card={id:'wc_'+Date.now(),title:'',body:'',imageUrl:null,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
  LIBRARY.push(card);
  if(!ASSIGNMENTS['*'])ASSIGNMENTS['*']=[];
  ASSIGNMENTS['*'].push(card.id);
  selectCard(card.id);
}

function selectCard(id){
  ACTIVE_ID=id;var card=findCard(id);
  if(!card){showEmpty();return;}
  $('editor-empty').style.display='none';
  $('editor-form').style.display='block';
  $('editor-actions').style.display='flex';
  $('editor-title').textContent=card.title||'New card';
  $('card-title').value=card.title||'';
  $('card-body').value=card.body||'';
  status('');
  clearImageState();
  if(card.imageUrl){IMG.croppedData=card.imageUrl;showMarkupPhase(card.imageUrl);}
  else{showUploadPhase();}
  renderAssignments();updatePreview();renderSidebar();
}

function duplicateCard(){
  var card=findCard(ACTIVE_ID);if(!card)return;
  var copy=JSON.parse(JSON.stringify(card));
  copy.id='wc_'+Date.now();copy.title=card.title+' (copy)';copy.createdAt=new Date().toISOString();
  LIBRARY.push(copy);
  for(var k in ASSIGNMENTS){if((ASSIGNMENTS[k]||[]).indexOf(card.id)!==-1){if(!ASSIGNMENTS[k])ASSIGNMENTS[k]=[];ASSIGNMENTS[k].push(copy.id);}}
  selectCard(copy.id);
}

function deleteCard(){
  if(!confirm('Delete this card?'))return;
  LIBRARY=LIBRARY.filter(function(c){return c.id!==ACTIVE_ID;});
  for(var k in ASSIGNMENTS){ASSIGNMENTS[k]=(ASSIGNMENTS[k]||[]).filter(function(id){return id!==ACTIVE_ID;});}
  ACTIVE_ID=null;showEmpty();renderSidebar();persistData();
}

function saveCard(){
  var card=findCard(ACTIVE_ID);
  if(!card){status('No card selected','err');return;}
  card.title=$('card-title').value.trim();
  card.body=$('card-body').value.trim();
  if(!card.title){status('Title required','err');return;}
  applyAssignmentUI();
  card.updatedAt=new Date().toISOString();

  // Capture image from markup canvas if visible
  var mc=$('markup-canvas');
  var markupVisible=$('markup-container').style.display!=='none';
  if(mc && mc.width>0 && markupVisible){
    try{card.imageUrl=mc.toDataURL('image/jpeg',0.8);}catch(e){console.error('Canvas export failed:',e);}
  }else if(IMG.croppedData){
    card.imageUrl=IMG.croppedData;
  }else{
    card.imageUrl=null;
  }

  $('editor-title').textContent=card.title;
  renderSidebar();updatePreview();persistData();
}

function persistData(){
  $('btn-save').disabled=true;status('Saving...','');
  api('saveWikiData',{library:LIBRARY,assignments:ASSIGNMENTS}).then(function(){
    $('btn-save').disabled=false;status('Saved!','ok');
  }).catch(function(e){
    $('btn-save').disabled=false;status('Save failed: '+e.message,'err');
    console.error('persistData failed:',e);
  });
}

function findCard(id){for(var i=0;i<LIBRARY.length;i++){if(LIBRARY[i].id===id)return LIBRARY[i];}return null;}
function showEmpty(){$('editor-empty').style.display='flex';$('editor-form').style.display='none';$('editor-actions').style.display='none';$('editor-title').textContent='Select a card or create new';}

function updatePreview(){
  var t=$('card-title').value.trim()||'Title';
  var b=$('card-body').value.trim()||'Body text';
  $('preview-title').textContent=t;
  $('preview-body').textContent=b;
  var imgEl=$('preview-img');
  var mc=$('markup-canvas');
  var markupVisible=$('markup-container').style.display!=='none';
  if(mc && mc.width>0 && markupVisible){
    try{imgEl.innerHTML='<img src="'+mc.toDataURL('image/jpeg',0.8)+'">';}catch(e){imgEl.innerHTML='';}
  }else if(IMG.croppedData){
    imgEl.innerHTML='<img src="'+IMG.croppedData+'">';
  }else{imgEl.innerHTML='';}
  // Render dots
  var dotsEl=$('preview-dots');
  if(LIBRARY.length>1){
    var idx=0;for(var i=0;i<LIBRARY.length;i++){if(LIBRARY[i].id===ACTIVE_ID){idx=i;break;}}
    var dots='';for(var i=0;i<LIBRARY.length;i++){
      dots+='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px;background:'+(i===idx?'var(--primary)':'var(--border)')+'"></span>';
    }
    dotsEl.innerHTML=dots;
  }else{dotsEl.innerHTML='';}
}

function showUploadPhase(){$('img-drop').style.display='flex';$('crop-container').style.display='none';$('markup-container').style.display='none';$('img-area').classList.remove('has-image');}
function clearImage(){clearImageState();IMG.croppedData=null;showUploadPhase();$('img-input').value='';updatePreview();}
function clearImageState(){IMG.raw=null;IMG.cropX=0;IMG.cropY=0;IMG.cropScale=1;IMG.markupHistory=[];IMG.drawing=false;}

function imageUploaded(input){
  if(!input.files||!input.files[0])return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){IMG.raw=img;showCropPhase();};
    img.onerror=function(){status('Image load failed','err');};
    img.src=e.target.result;
  };
  reader.readAsDataURL(input.files[0]);
}

function showCropPhase(){
  $('img-drop').style.display='none';
  $('crop-container').style.display='block';
  $('markup-container').style.display='none';
  $('img-area').classList.add('has-image');
  var vp=$('crop-viewport');var imgEl=$('crop-img');
  imgEl.src=IMG.raw.src;
  var vw=vp.offsetWidth||300;var vh=300;
  var scale=Math.max(vw/IMG.raw.width,vh/IMG.raw.height);
  IMG.cropScale=scale;
  IMG.cropX=(vw-IMG.raw.width*scale)/2;
  IMG.cropY=(vh-IMG.raw.height*scale)/2;
  applyCropTransform();

  var dragging=false,sx,sy,scx,scy;
  vp.onpointerdown=function(e){
    e.preventDefault();dragging=true;sx=e.clientX;sy=e.clientY;scx=IMG.cropX;scy=IMG.cropY;
    vp.setPointerCapture(e.pointerId);
  };
  vp.onpointermove=function(e){
    if(!dragging)return;e.preventDefault();
    IMG.cropX=scx+(e.clientX-sx);IMG.cropY=scy+(e.clientY-sy);applyCropTransform();
  };
  vp.onpointerup=function(e){dragging=false;};
  vp.onwheel=function(e){
    e.preventDefault();var d=e.deltaY>0?0.9:1.1;
    var min=Math.max(vw/IMG.raw.width,vh/IMG.raw.height)*0.3;
    IMG.cropScale=Math.max(min,Math.min(5,IMG.cropScale*d));applyCropTransform();
  };
}

function applyCropTransform(){
  var el=$('crop-img');
  el.style.transform='translate('+IMG.cropX+'px,'+IMG.cropY+'px) scale('+IMG.cropScale+')';
  el.style.width=IMG.raw.width+'px';el.style.height=IMG.raw.height+'px';
}

function confirmCrop(){
  var vp=$('crop-viewport');var vw=vp.offsetWidth||300;var vh=300;
  var c=document.createElement('canvas');c.width=vw;c.height=vh;
  c.getContext('2d').drawImage(IMG.raw,IMG.cropX,IMG.cropY,IMG.raw.width*IMG.cropScale,IMG.raw.height*IMG.cropScale);
  IMG.croppedData=c.toDataURL('image/jpeg',0.85);
  showMarkupPhase(IMG.croppedData);
}

function recrop(){if(!IMG.raw){clearImage();return;}showCropPhase();}

function showMarkupPhase(dataUrl){
  $('img-drop').style.display='none';
  $('crop-container').style.display='none';
  $('markup-container').style.display='block';
  $('img-area').classList.add('has-image');
  var canvas=$('markup-canvas');var ctx=canvas.getContext('2d');
  var img=new Image();
  img.onload=function(){
    canvas.width=img.width;canvas.height=img.height;
    ctx.drawImage(img,0,0);
    saveMarkupSnapshot();initMarkupEvents();updatePreview();
  };
  img.src=dataUrl;
}

function saveMarkupSnapshot(){var c=$('markup-canvas');IMG.markupHistory.push(c.toDataURL());if(IMG.markupHistory.length>20)IMG.markupHistory.shift();}

function undoMarkup(){
  if(IMG.markupHistory.length<2)return;IMG.markupHistory.pop();
  var prev=IMG.markupHistory[IMG.markupHistory.length-1];
  var c=$('markup-canvas');var ctx=c.getContext('2d');
  var img=new Image();img.onload=function(){ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(img,0,0);updatePreview();};img.src=prev;
}

function buildColorPalette(){
  var el=$('color-palette');var h='';
  for(var i=0;i<COLORS.length;i++){
    var a=COLORS[i]===IMG.color?' active':'';
    var bdr=COLORS[i]==='#ffffff'?';border:1px solid var(--border)':'';
    h+='<span class="color-swatch'+a+'" style="background:'+COLORS[i]+bdr+'" data-color="'+COLORS[i]+'"></span>';
  }
  el.innerHTML=h;
  el.querySelectorAll('.color-swatch').forEach(function(sw){
    sw.addEventListener('click',function(){
      IMG.color=this.dataset.color;
      el.querySelectorAll('.color-swatch').forEach(function(s){s.classList.remove('active');});
      this.classList.add('active');
    });
  });
}

function setTool(t){
  IMG.tool=t;
  $('tool-draw').classList.toggle('active',t==='draw');
  $('tool-text').classList.toggle('active',t==='text');
  $('tool-eraser').classList.toggle('active',t==='eraser');
}

function initMarkupEvents(){
  var canvas=$('markup-canvas');var ctx=canvas.getContext('2d');
  function getPos(e){
    var rect=canvas.getBoundingClientRect();
    var sx=canvas.width/rect.width;var sy=canvas.height/rect.height;
    var cx,cy;
    if(e.touches&&e.touches.length>0){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}
    else{cx=e.clientX;cy=e.clientY;}
    return{x:(cx-rect.left)*sx,y:(cy-rect.top)*sy};
  }
  canvas.onpointerdown=function(e){
    e.preventDefault();
    if(IMG.tool==='text'){
      var pos=getPos(e);var text=prompt('Enter text:');if(!text)return;
      var fontSize=Math.max(18,Math.round(canvas.width/18));
      ctx.font='bold '+fontSize+'px -apple-system,sans-serif';
      ctx.fillStyle=IMG.color;
      ctx.strokeStyle=IMG.color==='#ffffff'?'#000':'rgba(0,0,0,0.5)';
      ctx.lineWidth=Math.max(1,fontSize/12);
      ctx.strokeText(text,pos.x,pos.y);ctx.fillText(text,pos.x,pos.y);
      saveMarkupSnapshot();updatePreview();return;
    }
    IMG.drawing=true;var pos=getPos(e);
    ctx.beginPath();ctx.moveTo(pos.x,pos.y);ctx.lineCap='round';ctx.lineJoin='round';
    if(IMG.tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=Math.max(10,Math.round(canvas.width/20));}
    else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=IMG.color;ctx.lineWidth=Math.max(4,Math.round(canvas.width/60));}
    canvas.setPointerCapture(e.pointerId);
  };
  canvas.onpointermove=function(e){if(!IMG.drawing)return;e.preventDefault();var pos=getPos(e);ctx.lineTo(pos.x,pos.y);ctx.stroke();};
  canvas.onpointerup=function(){if(!IMG.drawing)return;IMG.drawing=false;ctx.globalCompositeOperation='source-over';saveMarkupSnapshot();updatePreview();};
}

function renderAssignments(){
  var card=findCard(ACTIVE_ID);if(!card)return;
  var inWild=(ASSIGNMENTS['*']||[]).indexOf(card.id)!==-1;
  $('assign-all').checked=inWild;
  var el=$('assign-events');
  if(EVENTS.length===0){el.innerHTML='<div style="font-size:0.78rem;color:var(--text-dim);padding:4px 0">No events found.</div>';return;}
  var h='';
  for(var i=0;i<EVENTS.length;i++){
    var ev=EVENTS[i];var inEv=(ASSIGNMENTS[ev.eventId]||[]).indexOf(card.id)!==-1;
    var checked=inWild||inEv;
    h+='<div class="assign-row"><input type="checkbox" id="assign-'+i+'" value="'+esc(ev.eventId)+'"'+(checked?' checked':'')+' onchange="assignChanged()"><label for="assign-'+i+'">'+esc(ev.name)+' <span style="color:var(--text-dim);font-size:0.72rem">('+esc(ev.status)+')</span></label></div>';
  }
  el.innerHTML=h;
}

function toggleAssignAll(){
  var checked=$('assign-all').checked;
  var boxes=document.querySelectorAll('#assign-events input[type=checkbox]');
  for(var i=0;i<boxes.length;i++)boxes[i].checked=checked;
}

function assignChanged(){
  var boxes=document.querySelectorAll('#assign-events input[type=checkbox]');
  var allChecked=true;
  for(var i=0;i<boxes.length;i++){if(!boxes[i].checked){allChecked=false;break;}}
  $('assign-all').checked=allChecked;
}

function applyAssignmentUI(){
  var card=findCard(ACTIVE_ID);if(!card)return;var cid=card.id;
  for(var k in ASSIGNMENTS){ASSIGNMENTS[k]=(ASSIGNMENTS[k]||[]).filter(function(id){return id!==cid;});}
  if($('assign-all').checked){
    if(!ASSIGNMENTS['*'])ASSIGNMENTS['*']=[];ASSIGNMENTS['*'].push(cid);
  }else{
    var boxes=document.querySelectorAll('#assign-events input[type=checkbox]');
    for(var i=0;i<boxes.length;i++){
      if(boxes[i].checked){var eid=boxes[i].value;if(!ASSIGNMENTS[eid])ASSIGNMENTS[eid]=[];ASSIGNMENTS[eid].push(cid);}
    }
  }
}

document.addEventListener('DOMContentLoaded',function(){
  $('card-title').addEventListener('input',updatePreview);
  $('card-body').addEventListener('input',updatePreview);
  buildColorPalette();
  $('auth-key').addEventListener('keydown',function(e){if(e.key==='Enter')doAuth();});
  var hash=window.location.hash;
  if(hash&&hash.indexOf('#key=')===0)$('auth-key').value=hash.substring(5);
});
</script>
