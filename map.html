<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CMRA Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<style>
:root{
  --bg:#f2f2f7;--surface:#fff;--surface-2:#f0f0f5;
  --border:#d1d1d6;--primary:#2563eb;--accent:#2c8a3d;
  --danger:#dc2626;--text:#1c1c1e;--text-dim:#8e8e93;
  --radius:12px;--radius-sm:8px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  --mono:'JetBrains Mono',ui-monospace,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column}

.toolbar{padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:1000}
.toolbar h1{font-size:0.95rem;font-weight:800;margin:0;white-space:nowrap}
.toolbar select,.toolbar button{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:0.82rem;font-family:inherit;background:var(--surface);cursor:pointer}
.toolbar button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.toolbar button:disabled{opacity:0.5;cursor:default}
.toolbar .spacer{flex:1}

#map{flex:1;min-height:0}

.legend{padding:6px 12px;background:var(--surface);border-top:1px solid var(--border);font-size:0.72rem;color:var(--text-dim);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.legend-section{display:flex;gap:6px;align-items:center}
.legend-title{font-weight:700;margin-right:2px}

.info-panel{position:absolute;bottom:40px;left:10px;right:10px;max-width:360px;background:var(--surface);border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,0.15);padding:14px;z-index:1000;display:none;max-height:40vh;overflow-y:auto;font-size:0.85rem}
.info-panel.active{display:block}

.layer-toggle{display:flex;align-items:center;gap:4px;font-size:0.78rem;color:var(--text-dim);cursor:pointer;user-select:none}
.layer-toggle input{margin:0}

.gradient-bar{height:12px;border-radius:6px;flex:1;min-width:80px}
</style>
</head>
<body>

<div class="toolbar">
  <h1>🗺️ CMRA Map</h1>
  <select id="event-select" onchange="loadEventData()">
    <option value="">All events</option>
  </select>
  <select id="lens-select" onchange="recolorPaths()">
    <option value="sqrt_cpue">√CPUE</option>
    <option value="post_rating">Rating</option>
    <option value="divergence">Divergence</option>
  </select>
  <button onclick="refreshData()" id="btn-refresh">Refresh</button>
  <div class="spacer"></div>
  <select id="draw-target" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:0.82rem;font-family:inherit;background:var(--surface)">
    <option value="community">Community</option>
    <option value="tl">TL Dashboard</option>
    <option value="volunteer">Volunteer</option>
  </select>
  <button onclick="saveAnnotations()" id="btn-save-draw" style="background:var(--accent);color:#fff;border-color:var(--accent)">Save</button>
  <label class="layer-toggle"><input type="checkbox" id="tog-paths" checked onchange="toggleLayer('paths')"> Paths</label>
  <label class="layer-toggle"><input type="checkbox" id="tog-pins" checked onchange="toggleLayer('pins')"> Pins</label>
  <label class="layer-toggle"><input type="checkbox" id="tog-zones" checked onchange="toggleLayer('zones')"> Zones</label>
  <label class="layer-toggle"><input type="checkbox" id="tog-annotations" checked onchange="toggleLayer('annotations')"> Drawings</label>
</div>

<div id="map"></div>

<div class="legend" id="legend">
  <div class="legend-section">
    <span class="legend-title">Pins:</span>
    📍General 🚫Dumping ⚠️Hazard 🚪Access 🅿️Parking 👋Meetup 🗑️Waste bin
  </div>
  <div class="legend-section">
    <span class="legend-title" id="gradient-label">√CPUE:</span>
    <span>0</span>
    <div class="gradient-bar" id="gradient-bar" style="background:linear-gradient(to right,rgb(0,200,80),rgb(128,200,0),rgb(200,180,0),rgb(255,100,0),rgb(255,0,0))"></div>
    <span>10</span>
  </div>
</div>

<script>
var API_URL='https://script.google.com/macros/s/AKfycbxbcHE2mwrnhZHYnLTZwVyPqPfvK3G6ObRtPTtwXQmoVR1s-DVWp479p6bZOOLN5x9eag/exec';

var map,allEvents=[],pathLayers=[],pinLayers=[],zoneLayers=[],annotationLayers=[];
var reportBlobs={};
var currentLens='sqrt_cpue';
var drawnItems,drawControl;

// Auth — try TL session, then organizer session, then admin key
function getAuth(){
  var auth={};
  try{var s=JSON.parse(localStorage.getItem('cmra_tl_session')||'null');if(s&&s.sessionToken)auth.sessionToken=s.sessionToken;}catch(e){}
  if(!auth.sessionToken){try{var o=JSON.parse(localStorage.getItem('cmra_organizer_session')||'null');if(o&&o.sessionToken)auth.sessionToken=o.sessionToken;}catch(e){}}
  return auth;
}

function api(action,data){
  var body=Object.assign({action:action,version:'v3'},getAuth(),data||{});
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(r){if(!r.success)throw new Error(r.error||'API error');return r.data;});
}

function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

// ═══ Init ═══
function init(){
  map=L.map('map',{zoomControl:true}).setView([32.3617,-86.2792],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(map);
  
  // Drawing layer
  drawnItems=new L.FeatureGroup();
  map.addLayer(drawnItems);
  
  var params=new URLSearchParams(window.location.search);
  var mode=params.get('mode')||'all';
  var eventId=params.get('eventId');
  var lens=params.get('lens');
  var configTarget=params.get('config');
  
  // Drawing tools (not on posted/community views)
  if(mode!=='community'&&mode!=='embed'&&!configTarget){
    drawControl=new L.Control.Draw({
      position:'topright',
      draw:{
        polyline:{shapeOptions:{color:'#e53e3e',weight:3}},
        polygon:{shapeOptions:{color:'#3b82f6',weight:2,fillOpacity:0.15}},
        rectangle:{shapeOptions:{color:'#f59e0b',weight:2,fillOpacity:0.15}},
        circle:{shapeOptions:{color:'#8b5cf6',weight:2,fillOpacity:0.15}},
        marker:true,
        circlemarker:false
      },
      edit:{featureGroup:drawnItems,remove:true}
    });
    map.addControl(drawControl);
    
    map.on(L.Draw.Event.CREATED,function(e){
      var layer=e.layer;
      var label=prompt('Label (optional):');
      if(label){layer.bindPopup('<strong>'+esc(label)+'</strong>');layer._annotationLabel=label;}
      var color=prompt('Color? (red/blue/yellow/green/purple or hex)','red');
      if(color){
        var cm={red:'#e53e3e',blue:'#3b82f6',yellow:'#f59e0b',green:'#10b981',purple:'#8b5cf6',orange:'#f97316',black:'#1c1c1e',white:'#ffffff'};
        var c=cm[color.toLowerCase()]||color;
        if(layer.setStyle)layer.setStyle({color:c,fillColor:c});
        layer._annotationColor=c;
      }
      drawnItems.addLayer(layer);
    });
    
    // Shift+click for text labels
    map.on('click',function(e){
      if(!e.originalEvent.shiftKey)return;
      var text=prompt('Text label:');
      if(!text)return;
      var marker=L.marker(e.latlng,{icon:L.divIcon({className:'',html:'<div style="font-size:13px;font-weight:800;color:#1c1c1e;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap;padding:2px 6px">'+esc(text)+'</div>',iconSize:[200,20],iconAnchor:[100,10]})});
      marker._annotationLabel=text;marker._isTextLabel=true;
      drawnItems.addLayer(marker);
    });
  }
  
  // Hide toolbar for posted/community views
  if(mode==='community'||mode==='embed'){
    document.querySelector('.toolbar').style.display='none';
  }
  
  if(lens){
    document.getElementById('lens-select').value=lens;
    currentLens=lens;
  }
  
  // Load posted config or direct
  if(configTarget){
    document.querySelector('.toolbar').style.display='none';
    api('getPostedMap',{target:configTarget}).then(function(d){
      if(d.config){
        var c=d.config;
        if(c.eventId)eventId=c.eventId;
        if(c.lens){currentLens=c.lens;document.getElementById('lens-select').value=c.lens;}
      }
      loadEventsAndData(eventId);
      loadAnnotations(configTarget);
    }).catch(function(){loadEventsAndData(eventId);});
  }else{
    loadEventsAndData(eventId);
    // Load annotations for current draw target
    loadAnnotations(document.getElementById('draw-target').value);
  }
  
  if(configTarget||mode==='community'){
    setInterval(function(){loadEventData();},60000);
  }
}

function loadEventsAndData(eventId){
  api('listActiveEvents').then(function(events){
    allEvents=events||[];
    var sel=document.getElementById('event-select');
    for(var i=0;i<allEvents.length;i++){
      var opt=document.createElement('option');
      opt.value=allEvents[i].eventId;
      opt.textContent=allEvents[i].name+(allEvents[i].eventCode?' ('+allEvents[i].eventCode+')':'');
      sel.appendChild(opt);
    }
    if(eventId)sel.value=eventId;
    loadZones();
    loadEventData();
  }).catch(function(e){console.error('Init error:',e);loadEventData();});
}

// ═══ Zones (event starting locations) ═══
function loadZones(){
  clearLayers(zoneLayers);
  var bounds=[];
  for(var i=0;i<allEvents.length;i++){
    var ev=allEvents[i];
    if(!ev.startingLocation)continue;
    var ll=[ev.startingLocation.lat,ev.startingLocation.lon];
    bounds.push(ll);
    var circle=L.circle(ll,{radius:100,color:ev.status==='active'?'#2563eb':'#8e8e93',weight:2,fillOpacity:0.1,dashArray:ev.status==='active'?null:'4 4'});
    circle.bindPopup('<strong>'+esc(ev.name)+'</strong><br>'+esc(ev.status)+' · '+(ev.eventCode||''));
    circle.addTo(map);
    zoneLayers.push(circle);
    
    var label=L.marker(ll,{icon:L.divIcon({className:'',html:'<div style="font-size:11px;font-weight:800;color:#2563eb;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap">'+esc(ev.name)+'</div>',iconSize:[100,16],iconAnchor:[50,20]})});
    label.addTo(map);
    zoneLayers.push(label);
  }
  if(bounds.length>0)map.fitBounds(bounds,{padding:[40,40],maxZoom:15});
}

// ═══ Load Event Data ═══
function loadEventData(){
  var eventId=document.getElementById('event-select').value;
  var btn=document.getElementById('btn-refresh');
  btn.disabled=true;btn.textContent='Loading…';
  
  // Load pins
  loadPins(eventId);
  
  // Load paths
  if(eventId){
    api('generateReport',{eventId:eventId}).then(function(res){
      btn.disabled=false;btn.textContent='Refresh';
      if(res&&(res.blob||res.cachedBlob)){
        reportBlobs[eventId]=res.blob||res.cachedBlob;
        renderPaths();
      }
    }).catch(function(e){
      btn.disabled=false;btn.textContent='Refresh';
      // Try cached
      if(reportBlobs[eventId])renderPaths();
      else console.log('Report error:',e.message);
    });
  }else{
    // Load all events
    var pending=allEvents.length;
    if(pending===0){btn.disabled=false;btn.textContent='Refresh';return;}
    for(var i=0;i<allEvents.length;i++){
      (function(eid){
        api('generateReport',{eventId:eid}).then(function(res){
          if(res&&(res.blob||res.cachedBlob))reportBlobs[eid]=res.blob||res.cachedBlob;
          if(--pending===0){btn.disabled=false;btn.textContent='Refresh';renderPaths();}
        }).catch(function(){if(--pending===0){btn.disabled=false;btn.textContent='Refresh';renderPaths();}});
      })(allEvents[i].eventId);
    }
  }
}

function refreshData(){loadZones();loadEventData();}

// ═══ Pins ═══
function loadPins(eventId){
  clearLayers(pinLayers);
  var catEmoji={general:'📍',dumping:'🚫',hazard:'⚠️',access:'🚪',parking:'🅿️',meetup:'👋',wastebin:'🗑️'};
  
  function addPins(pins){
    for(var i=0;i<pins.length;i++){
      var p=pins[i];
      var emoji=catEmoji[p.category]||'📍';
      var marker=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:'<div style="font-size:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.4))">'+emoji+'</div>',iconSize:[22,22],iconAnchor:[11,22],popupAnchor:[0,-22]})});
      var popup='<strong>'+esc(p.author_name||p.created_by||'Pin')+'</strong><br>'+esc(p.note||p.category);
      if(p.photoUrl)popup+='<br><img src="'+esc(p.photoUrl)+'" style="max-width:180px;max-height:120px;margin-top:4px;border-radius:4px" onerror="this.style.display=\'none\'">';
      popup+='<br><span style="font-size:0.7rem;color:#888">'+(p.created_at?new Date(p.created_at).toLocaleString():'')+'</span>';
      marker.bindPopup(popup);
      if(document.getElementById('tog-pins').checked)marker.addTo(map);
      pinLayers.push(marker);
    }
  }
  
  if(eventId){
    api('getEventPins',{eventId:eventId}).then(function(d){addPins(d.pins||[]);}).catch(function(){});
  }else{
    for(var i=0;i<allEvents.length;i++){
      (function(eid){
        api('getEventPins',{eventId:eid}).then(function(d){addPins(d.pins||[]);}).catch(function(){});
      })(allEvents[i].eventId);
    }
  }
  
  // TL pins
  var auth=getAuth();
  if(auth.sessionToken){
    api('tl_listPins').then(function(d){addPins(d.pins||[]);}).catch(function(){});
  }
}

// ═══ Paths ═══
function renderPaths(){
  clearLayers(pathLayers);
  var eventId=document.getElementById('event-select').value;
  var eids=eventId?[eventId]:Object.keys(reportBlobs);
  var bounds=[];
  
  for(var e=0;e<eids.length;e++){
    var blob=reportBlobs[eids[e]];
    if(!blob)continue;
    var vols=(blob.volunteers||[]).concat(blob.externalTrackers||[]);
    for(var v=0;v<vols.length;v++){
      var sessions=vols[v].sessions||[];
      for(var s=0;s<sessions.length;s++){
        var legs=sessions[s].legs||[];
        for(var l=0;l<legs.length;l++){
          var leg=legs[l];
          if(!leg.trackPoints||leg.trackPoints.length<2)continue;
          var color=lensColor(leg);
          var latlngs=leg.trackPoints.map(function(p){return[p.lat,p.lon];});
          for(var p=0;p<latlngs.length;p++)bounds.push(latlngs[p]);
          var poly=L.polyline(latlngs,{color:color,weight:leg.inFlight?5:3,opacity:leg.inFlight?0.95:0.8});
          poly.bindPopup('<strong>'+esc(vols[v].displayName)+'</strong><br>Leg '+leg.legNumber+
            '<br>Weight: '+(leg.weightLbs!=null?leg.weightLbs.toFixed(2):'—')+' lbs'+
            '<br>Distance: '+(leg.distanceM!=null?(leg.distanceM/1609.34).toFixed(4):'—')+' mi'+
            '<br>√CPUE: '+(leg.sqrtCpueRaw!=null?leg.sqrtCpueRaw.toFixed(4):'—'));
          if(document.getElementById('tog-paths').checked)poly.addTo(map);
          pathLayers.push(poly);
        }
      }
    }
  }
  if(bounds.length>0)map.fitBounds(bounds,{padding:[30,30]});
}

function recolorPaths(){
  currentLens=document.getElementById('lens-select').value;
  var label=document.getElementById('gradient-label');
  if(currentLens==='sqrt_cpue')label.textContent='√CPUE:';
  else if(currentLens==='post_rating')label.textContent='Rating:';
  else label.textContent='Divergence:';
  
  var bar=document.getElementById('gradient-bar');
  if(currentLens==='divergence'){
    bar.style.background='linear-gradient(to right,rgb(50,100,220),rgb(220,220,230),rgb(220,50,50))';
  }else{
    bar.style.background='linear-gradient(to right,rgb(0,200,80),rgb(128,200,0),rgb(200,180,0),rgb(255,100,0),rgb(255,0,0))';
  }
  renderPaths();
}

function lensColor(leg){
  var v=null;
  if(currentLens==='sqrt_cpue')v=leg.sqrtCpueRaw;
  else if(currentLens==='post_rating')v=leg.postRating;
  else if(currentLens==='divergence')v=leg.divergence;
  if(v==null)return'#8e8e93';
  if(currentLens==='divergence'){
    var clamped=Math.max(-5,Math.min(5,v));
    var norm=(clamped+5)/10;
    if(norm<0.5){var t=norm*2;return'rgb('+Math.floor(50+170*t)+','+Math.floor(100+120*t)+','+Math.floor(220-190*t)+')';}
    else{var t=(norm-0.5)*2;return'rgb('+Math.floor(220)+','+Math.floor(220-170*t)+','+Math.floor(230-180*t)+')';}
  }
  var norm=Math.max(0,Math.min(10,Math.abs(v)))/10;
  var stops=[[0,200,80],[128,200,0],[200,180,0],[255,100,0],[255,0,0]];
  var idx=norm*4;var lo=Math.floor(idx);var hi=Math.min(lo+1,4);var t=idx-lo;
  var r=Math.floor(stops[lo][0]+(stops[hi][0]-stops[lo][0])*t);
  var g=Math.floor(stops[lo][1]+(stops[hi][1]-stops[lo][1])*t);
  var b=Math.floor(stops[lo][2]+(stops[hi][2]-stops[lo][2])*t);
  return'rgb('+r+','+g+','+b+')';
}

// ═══ Layer Toggles ═══
function toggleLayer(name){
  var checked=document.getElementById('tog-'+name).checked;
  var layers=name==='paths'?pathLayers:name==='pins'?pinLayers:name==='zones'?zoneLayers:name==='annotations'?[drawnItems]:[];
  for(var i=0;i<layers.length;i++){
    if(checked){if(!map.hasLayer(layers[i]))layers[i].addTo(map);}
    else map.removeLayer(layers[i]);
  }
}

function clearLayers(arr){
  for(var i=0;i<arr.length;i++){try{map.removeLayer(arr[i]);}catch(e){}}
  arr.length=0;
}

// ═══ Annotations — save/load per target ═══
function saveAnnotations(){
  var target=document.getElementById('draw-target').value;
  var eventId=document.getElementById('event-select').value;
  var annotations=[];
  drawnItems.eachLayer(function(layer){
    var a={label:layer._annotationLabel||'',color:layer._annotationColor||null,isText:!!layer._isTextLabel};
    if(layer instanceof L.Marker){
      a.type='marker';a.lat=layer.getLatLng().lat;a.lon=layer.getLatLng().lng;
    }else if(layer instanceof L.Circle){
      a.type='circle';a.lat=layer.getLatLng().lat;a.lon=layer.getLatLng().lng;a.radius=layer.getRadius();
      a.color=layer.options.color;
    }else if(layer instanceof L.Rectangle){
      var b=layer.getBounds();
      a.type='rectangle';a.bounds=[[b.getSouth(),b.getWest()],[b.getNorth(),b.getEast()]];
      a.color=layer.options.color;
    }else if(layer instanceof L.Polygon){
      a.type='polygon';a.latlngs=layer.getLatLngs()[0].map(function(ll){return[ll.lat,ll.lng];});
      a.color=layer.options.color;
    }else if(layer instanceof L.Polyline){
      a.type='polyline';a.latlngs=layer.getLatLngs().map(function(ll){return[ll.lat,ll.lng];});
      a.color=layer.options.color;
    }
    annotations.push(a);
  });
  
  var config={
    eventId:eventId||null,
    lens:document.getElementById('lens-select').value,
    annotations:annotations,
    center:[map.getCenter().lat,map.getCenter().lng],
    zoom:map.getZoom(),
    postedAt:new Date().toISOString()
  };
  
  var btn=document.getElementById('btn-save-draw');
  btn.disabled=true;btn.textContent='Saving…';
  api('admin_setSetting',{key:'map_config_'+target,value:config,description:'Posted map for '+target}).then(function(){
    btn.disabled=false;btn.textContent='Save';
    alert('Saved to '+target+'!');
  }).catch(function(e){btn.disabled=false;btn.textContent='Save';alert('Error: '+e.message);});
}

function loadAnnotations(target){
  if(!target)return;
  api('getPostedMap',{target:target}).then(function(d){
    if(!d.config||!d.config.annotations)return;
    renderAnnotations(d.config.annotations);
    if(d.config.center&&d.config.zoom){
      map.setView(d.config.center,d.config.zoom);
    }
  }).catch(function(){});
}

function renderAnnotations(annotations){
  drawnItems.clearLayers();
  for(var i=0;i<annotations.length;i++){
    var a=annotations[i];
    var layer;
    if(a.type==='marker'){
      if(a.isText&&a.label){
        layer=L.marker([a.lat,a.lon],{icon:L.divIcon({className:'',html:'<div style="font-size:13px;font-weight:800;color:'+(a.color||'#1c1c1e')+';text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap;padding:2px 6px">'+esc(a.label)+'</div>',iconSize:[200,20],iconAnchor:[100,10]})});
      }else{
        layer=L.marker([a.lat,a.lon]);
      }
    }else if(a.type==='circle'){
      layer=L.circle([a.lat,a.lon],{radius:a.radius,color:a.color||'#8b5cf6',weight:2,fillOpacity:0.15});
    }else if(a.type==='rectangle'){
      layer=L.rectangle(a.bounds,{color:a.color||'#f59e0b',weight:2,fillOpacity:0.15});
    }else if(a.type==='polygon'){
      layer=L.polygon(a.latlngs,{color:a.color||'#3b82f6',weight:2,fillOpacity:0.15});
    }else if(a.type==='polyline'){
      layer=L.polyline(a.latlngs,{color:a.color||'#e53e3e',weight:3});
    }
    if(layer){
      if(a.label)layer.bindPopup('<strong>'+esc(a.label)+'</strong>');
      layer._annotationLabel=a.label;
      layer._annotationColor=a.color;
      layer._isTextLabel=a.isText;
      drawnItems.addLayer(layer);
    }
  }
}
