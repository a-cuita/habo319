<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HABO Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

  <style>
    /* ── VARIABLES ─────────────────────────── */
    :root {
      --bg:        #0f1210;
      --surface:   #1a1f1c;
      --border:    #2e3530;
      --accent:    #b5f033;
      --accent-dk: #8abe1a;
      --text:      #f0f4f1;
      --text-muted:#8a9e8f;
      --error:     #ff5c5c;
      --warning:   #f0a500;
      --assigned:  #f0a500;
      --radius:    12px;
      --font-head: 'Barlow Condensed', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --header-h:  60px;
      --nav-h:     52px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      display: flex;
      flex-direction: column;
    }

    /* ── LOGIN PAGE ────────────────────────── */
    #page-login {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      padding-bottom: 60px;
    }

    #page-login header {
      width: 100%;
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      padding: 20px 24px 16px;
      text-align: center;
    }

    .login-title {
      font-family: var(--font-head);
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      line-height: 1;
    }

    .login-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 32px 20px 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-label {
      font-family: var(--font-head);
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1.1;
    }

    .section-label span { color: var(--accent); }

    /* ── DASHBOARD LAYOUT ──────────────────── */
    #page-dashboard {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    #page-dashboard.active { display: flex; }

    /* ── HEADER ────────────────────────────── */
    .dash-header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .dash-title {
      font-family: var(--font-head);
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .dash-admin-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .admin-name {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: right;
    }

    .admin-name strong {
      display: block;
      color: var(--text);
      font-size: 0.9rem;
    }

    /* ── NAV TABS ──────────────────────────── */
    .dash-nav {
      height: var(--nav-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-shrink: 0;
    }

    .nav-tab {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-head);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: color 0.15s, border-color 0.15s;
    }

    .nav-tab:hover { color: var(--text); }
    .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── VIEWS ─────────────────────────────── */
    .view { display: none; flex: 1; overflow: hidden; }
    .view.active { display: flex; }

    /* ── EVENTS VIEW ───────────────────────── */
    #view-events {
      flex-direction: column;
      overflow-y: auto;
      padding: 20px;
      gap: 16px;
    }

    .view-heading {
      font-family: var(--font-head);
      font-size: 1.4rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    /* ── CARD ──────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── EVENT ITEM ────────────────────────── */
    .event-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .event-item:hover { border-color: var(--accent); }

    .event-item-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      gap: 12px;
    }

    .event-item-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .event-item-name {
      font-family: var(--font-head);
      font-size: 1.15rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-item-meta { font-size: 0.78rem; color: var(--text-muted); }

    .event-item-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .status-badge {
      font-family: var(--font-head);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 4px;
    }

    .status-upcoming  { background: rgba(181,240,51,0.12); color: var(--accent); }
    .status-active    { background: var(--accent); color: var(--bg); }
    .status-completed { background: rgba(138,158,143,0.15); color: var(--text-muted); }
    .status-cancelled { background: rgba(255,92,92,0.12); color: var(--error); }

    .expand-arrow {
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .event-item.open .expand-arrow { transform: rotate(180deg); }

    .event-item-body {
      display: none;
      padding: 0 16px 16px;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid var(--border);
    }

    .event-item.open .event-item-body { display: flex; }

    .event-body-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding-top: 12px;
    }

    .segment-list { display: flex; flex-direction: column; gap: 8px; }

    .segment-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .segment-item-name { font-size: 0.88rem; color: var(--text); font-weight: 600; }
    .segment-item-meta { font-size: 0.75rem; color: var(--text-muted); }

    .btn-icon {
      background: none;
      border: 1px solid var(--error);
      border-radius: 6px;
      color: var(--error);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 10px;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .btn-icon:hover { background: rgba(255,92,92,0.1); }

    .no-segments { font-size: 0.82rem; color: var(--text-muted); font-style: italic; }

    .timer-started {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      padding: 8px 0;
    }
    
    .status-controls { display: flex; gap: 8px; flex-wrap: wrap; }

    .status-btn {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-head);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 6px 14px;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s;
    }

    .status-btn:hover { border-color: var(--accent); color: var(--accent); }
    .status-btn.current { border-color: var(--accent); color: var(--accent); }

    /* ── VIEW ON MAP BUTTON ────────────────── */
    .view-on-map-btn {
      background: none;
      border: 1.5px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      cursor: pointer;
      font-family: var(--font-head);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 8px 16px;
      text-transform: uppercase;
      transition: background 0.15s;
      align-self: flex-start;
    }

    .view-on-map-btn:hover { background: rgba(181,240,51,0.08); }

    /* ── CREATE EVENT FORM ─────────────────── */
    .create-toggle {
      background: none;
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-head);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 16px;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s;
      width: 100%;
    }

    .create-toggle:hover { border-color: var(--accent); color: var(--accent); }

    /* ── MAP VIEW ──────────────────────────── */
    #view-map { position: relative; flex-direction: column; }
    #map { flex: 1; width: 100%; }

    /* ── MAP TOOLBAR ───────────────────────── */
    .map-toolbar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      pointer-events: none;
    }

    .map-toolbar > * { pointer-events: all; }

    .map-event-select {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.88rem;
      padding: 8px 12px;
      flex: 1;
      min-width: 0;
    }

    .map-event-select:focus { outline: none; border-color: var(--accent); }

    .map-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-head);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 8px 14px;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .map-btn:hover { border-color: var(--accent); color: var(--accent); }
    .map-btn.active-mode { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .map-btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

    /* ── MAP MODE BAR ──────────────────────── */
    .map-mode-bar {
      position: absolute;
      top: 56px;
      left: 12px;
      z-index: 1000;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: none;
    }

    .map-mode-bar.visible { display: block; }
    .map-mode-bar.draw    { border-color: var(--accent); color: var(--accent); }
    .map-mode-bar.assign  { border-color: var(--assigned); color: var(--assigned); }

    /* ── SEGMENT PANEL ─────────────────────── */
    .seg-panel {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      background: var(--surface);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .seg-panel.visible { display: flex; }

    .seg-panel-title {
      font-family: var(--font-head);
      font-size: 1.2rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text);
    }

    .seg-field-row { display: flex; flex-direction: column; gap: 4px; }

    .seg-field-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .seg-field-input {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.92rem;
      padding: 8px 12px;
      width: 100%;
      transition: border-color 0.15s;
    }

    .seg-field-input:focus { outline: none; border-color: var(--accent); }

    .seg-field-value { font-size: 0.92rem; color: var(--text); }
    .seg-panel-hint  { font-size: 0.78rem; color: var(--text-muted); font-style: italic; }
    .seg-panel-actions { display: flex; gap: 8px; }

    /* ── MAP LOADING ───────────────────────── */
    .map-loading {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.82rem;
      color: var(--text-muted);
      display: none;
    }

    .map-loading.visible { display: block; }

    /* ── FORMS ─────────────────────────────── */
    .field-wrap { display: flex; flex-direction: column; gap: 6px; }

    .field-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .field-input {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.95rem;
      padding: 12px 14px;
      width: 100%;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }

    .field-input:focus { outline: none; border-color: var(--accent); }
    .field-input::placeholder { color: var(--text-muted); opacity: 0.5; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ── BUTTONS ───────────────────────────── */
    .btn {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-head);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 13px 16px;
      text-transform: uppercase;
      transition: background 0.15s, transform 0.1s;
      width: 100%;
    }

    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: var(--bg); }
    .btn-primary:hover { background: var(--accent-dk); }
    .btn-ghost { background: transparent; border: 1.5px solid var(--border); color: var(--text-muted); font-size: 0.9rem; }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn.loading { opacity: 0.6; pointer-events: none; }
    .btn.loading::after { content: ' ...'; }
    .btn-sm { font-size: 0.85rem; padding: 9px 14px; }

    /* ── MESSAGES ──────────────────────────── */
    .error-msg {
      background: rgba(255,92,92,0.1);
      border: 1px solid var(--error);
      border-radius: 8px;
      color: var(--error);
      font-size: 0.85rem;
      padding: 10px 14px;
      display: none;
    }
    .error-msg.visible { display: block; }

    .success-msg {
      background: rgba(181,240,51,0.08);
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-size: 0.85rem;
      padding: 10px 14px;
      display: none;
    }
    .success-msg.visible { display: block; }

    /* ── LOGOUT BTN ────────────────────────── */
    .logout-btn {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-head);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 6px 12px;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s;
    }
    .logout-btn:hover { border-color: var(--error); color: var(--error); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.2s ease; }
    .leaflet-container { background: #1a1f1c; }
  </style>
</head>

<body>

  <!-- ══════════════════════════════════════ -->
  <!-- LOGIN PAGE                            -->
  <!-- ══════════════════════════════════════ -->
  <div id="page-login">
    <header>
      <div class="login-title">HABO Admin</div>
      <div class="login-subtitle">Help A Brother Out Foundation</div>
    </header>
    <div class="login-wrap">
      <div class="section-label">Admin<br /><span>Login</span></div>
      <div class="card">
        <div class="field-wrap">
          <label class="field-label">Username</label>
          <input class="field-input" type="text" id="login-username" placeholder="Admin username" autocomplete="off" />
        </div>
        <div class="field-wrap">
          <label class="field-label">Password</label>
          <input class="field-input" type="password" id="login-password" placeholder="Password" />
        </div>
        <div class="error-msg" id="login-error"></div>
        <button class="btn btn-primary" id="btn-login" onclick="handleLogin()">Log In</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════ -->
  <!-- DASHBOARD                             -->
  <!-- ══════════════════════════════════════ -->
  <div id="page-dashboard">

    <header class="dash-header">
      <div class="dash-title">HABO Admin</div>
      <div class="dash-admin-info">
        <div class="admin-name">
          <strong id="admin-display-name">—</strong>
          <span id="admin-display-role"></span>
        </div>
        <button class="logout-btn" onclick="handleLogout()">Log Out</button>
      </div>
    </header>

    <nav class="dash-nav">
      <button class="nav-tab active" id="tab-events" onclick="switchView('events')">Events</button>
      <button class="nav-tab" id="tab-map" onclick="switchView('map')">Map</button>
    </nav>

    <!-- ── EVENTS VIEW ──────────────────── -->
    <div class="view active" id="view-events">

      <div class="view-heading">Events</div>

      <button class="create-toggle" id="create-toggle" onclick="toggleCreateForm()">+ New Event</button>

      <div class="card fade-in" id="create-form" style="display:none;">
        <div class="view-heading" style="font-size:1.1rem;">New Event</div>
        <div class="field-wrap">
          <label class="field-label">Event Name</label>
          <input class="field-input" type="text" id="new-name" placeholder="e.g. Jackson Lake Cleanup — March 2026" />
        </div>
        <div class="field-row">
          <div class="field-wrap">
            <label class="field-label">Date</label>
            <input class="field-input" type="text" id="new-date" placeholder="YYYY-MM-DD" />
          </div>
          <div class="field-wrap">
            <label class="field-label">Watershed</label>
            <input class="field-input" type="text" id="new-watershed" placeholder="e.g. Jackson Lake" />
          </div>
        </div>
        <div class="field-wrap">
          <label class="field-label">Location Name</label>
          <input class="field-input" type="text" id="new-location" placeholder="e.g. Jackson Lake Boat Ramp" />
        </div>
        <div class="field-row">
          <div class="field-wrap">
            <label class="field-label">Latitude</label>
            <input class="field-input" type="text" id="new-lat" placeholder="e.g. 32.3792" />
          </div>
          <div class="field-wrap">
            <label class="field-label">Longitude</label>
            <input class="field-input" type="text" id="new-lon" placeholder="e.g. -86.3077" />
          </div>
        </div>
        <div class="field-wrap">
          <label class="field-label">Notes (optional)</label>
          <input class="field-input" type="text" id="new-notes" placeholder="Internal notes" />
        </div>
        <div class="error-msg" id="create-error"></div>
        <div class="success-msg" id="create-success"></div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-primary btn-sm" id="btn-create" onclick="handleCreateEvent()" style="flex:1;">Save Event</button>
          <button class="btn btn-ghost btn-sm" onclick="toggleCreateForm()" style="flex:0 0 auto; width:auto; padding:9px 20px;">Cancel</button>
        </div>
      </div>

      <div id="events-list">
        <div style="color:var(--text-muted); font-size:0.85rem;">Loading events...</div>
      </div>
      <div class="error-msg" id="events-error"></div>

    </div>

    <!-- ── MAP VIEW ─────────────────────── -->
    <div class="view" id="view-map">

      <div class="map-toolbar">
        <select class="map-event-select" id="map-event-select" onchange="onEventSelectChange()">
          <option value="">— Select event —</option>
        </select>
        <button class="map-btn" id="btn-draw" onclick="toggleDrawMode()">+ Segment</button>
        <button class="map-btn" id="btn-assign" onclick="toggleAssignMode()" disabled>Assign</button>
      </div>

      <div class="map-mode-bar" id="map-mode-bar"></div>
      <div class="map-loading" id="map-loading">Snapping to road...</div>

      <div id="map"></div>

      <div class="seg-panel" id="seg-panel">
        <div class="seg-panel-title">New Segment</div>
        <div class="seg-field-row">
          <div class="seg-field-label">Street</div>
          <input class="seg-field-input" type="text" id="seg-street" placeholder="Street name" />
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div class="seg-field-row">
            <div class="seg-field-label">From</div>
            <input class="seg-field-input" type="text" id="seg-from" placeholder="Cross street" />
          </div>
          <div class="seg-field-row">
            <div class="seg-field-label">To</div>
            <input class="seg-field-input" type="text" id="seg-to" placeholder="Cross street" />
          </div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div class="seg-field-row">
            <div class="seg-field-label">Length</div>
            <div class="seg-field-value" id="seg-length">—</div>
          </div>
          <div class="seg-field-row">
            <div class="seg-field-label">Watershed</div>
            <input class="seg-field-input" type="text" id="seg-watershed" placeholder="Watershed" />
          </div>
        </div>
        <div class="seg-panel-hint" id="seg-hint"></div>
        <div class="error-msg" id="seg-error"></div>
        <div class="seg-panel-actions">
          <button class="btn btn-primary btn-sm" id="btn-save-seg" onclick="handleSaveSegment()" style="flex:1;">Save Segment</button>
          <button class="btn btn-ghost btn-sm" onclick="cancelSegment()" style="flex:0 0 auto; width:auto; padding:9px 18px;">Cancel</button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <script>
    // ── CONFIG ──────────────────────────────
    const API_URL      = 'https://script.google.com/macros/s/AKfycbzpJeXDn2kHQEFkwkMNe7qVjkBsrnY47Pkw5gd0os9vtNC_b4eoNR2K3V2DSlc1J6Zb/exec';
    const OVERPASS_URL = 'https://overpass-api.de/api/interpreter';
    const NOMINATIM_URL= 'https://nominatim.openstreetmap.org/reverse';
    const MAP_CENTER   = [32.3792, -86.3077];
    const MAP_ZOOM     = 14;
    const COLOR_UNASSIGNED = '#b5f033';
    const COLOR_ASSIGNED   = '#f0a500';

    // ── SESSION ─────────────────────────────
    function getToken()     { return sessionStorage.getItem('habo_admin_token'); }
    function getAdminName() { return sessionStorage.getItem('habo_admin_name'); }
    function getAdminRole() { return sessionStorage.getItem('habo_admin_role'); }

    function saveSession(token, adminId, name, role) {
      sessionStorage.setItem('habo_admin_token', token);
      sessionStorage.setItem('habo_admin_id', adminId);
      sessionStorage.setItem('habo_admin_name', name);
      sessionStorage.setItem('habo_admin_role', role);
    }

    function clearSession() {
      ['habo_admin_token','habo_admin_id','habo_admin_name','habo_admin_role']
        .forEach(function(k) { sessionStorage.removeItem(k); });
    }

    // ── API HELPER ───────────────────────────
    async function apiCall(action, payload, token) {
      const body = { action, payload: payload || {} };
      if (token) body.token = token;
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(body)
      });
      return res.json();
    }

    // ── MESSAGES ─────────────────────────────
    function showError(id, msg)   { const el = document.getElementById(id); el.textContent = msg; el.classList.add('visible'); }
    function hideMsg(id)          { const el = document.getElementById(id); el.classList.remove('visible'); el.textContent = ''; }
    function showSuccess(id, msg) {
      const el = document.getElementById(id); el.textContent = msg; el.classList.add('visible');
      setTimeout(function() { el.classList.remove('visible'); el.textContent = ''; }, 3000);
    }

    // ── PAGE NAVIGATION ──────────────────────
    function showDashboard() {
      document.getElementById('page-login').style.display = 'none';
      document.getElementById('page-dashboard').classList.add('active');
      document.getElementById('admin-display-name').textContent = getAdminName() || '—';
      document.getElementById('admin-display-role').textContent = getAdminRole() || '';
    }

    function showLogin() {
      document.getElementById('page-login').style.display = 'flex';
      document.getElementById('page-dashboard').classList.remove('active');
    }

    // ── VIEW SWITCHING ───────────────────────
    function switchView(name) {
      document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
      document.querySelectorAll('.nav-tab').forEach(function(t) { t.classList.remove('active'); });
      document.getElementById('view-' + name).classList.add('active');
      document.getElementById('tab-' + name).classList.add('active');
      if (name === 'map') initMap();
    }

    // Called from Events page "View on Map" button
    function viewEventOnMap(eventId) {
      switchView('map');
      const sel = document.getElementById('map-event-select');
      sel.value = eventId;
      onEventSelectChange();
      setTimeout(function() { flyToEventSegments(eventId); }, 400);
    }

    function flyToEventSegments(eventId) {
      const assigned = assignedSegmentIds[eventId] || [];
      if (!assigned.length) return;
      const bounds = [];
      segmentLayers.forEach(function(entry) {
        if (assigned.indexOf(entry.segmentId) !== -1) {
          entry.layer.getLatLngs().forEach(function(p) { bounds.push(p); });
        }
      });
      if (bounds.length) map.fitBounds(L.latLngBounds(bounds), { padding: [40, 40] });
    }

    // ── LOGIN ─────────────────────────────────
    async function handleLogin() {
      hideMsg('login-error');
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      if (!username) return showError('login-error', 'Please enter your username.');
      if (!password) return showError('login-error', 'Please enter your password.');

      const btn = document.getElementById('btn-login');
      btn.classList.add('loading');
      try {
        const result = await apiCall('adminLogin', { username, password });
        if (!result.success) { showError('login-error', result.error || 'Login failed.'); return; }
        saveSession(result.data.session_token, result.data.admin_id, result.data.preferred_name, result.data.role);
        showDashboard();
        loadEvents();
        populateMapEventSelect();
      } catch (err) {
        showError('login-error', 'Connection error. Please try again.');
      } finally {
        btn.classList.remove('loading');
      }
    }

    // ── LOGOUT ───────────────────────────────
    async function handleLogout() {
      try { await apiCall('adminLogout', {}, getToken()); } catch (err) {}
      clearSession();
      showLogin();
    }

    // ── EVENTS ───────────────────────────────
    var allEvents = [];
    var allSegments = [];
    var assignedSegmentIds = {}; // { eventId: [segment_id, ...] }

    async function loadEvents() {
      hideMsg('events-error');
      document.getElementById('events-list').innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;">Loading...</div>';
      try {
        const result = await apiCall('getEvents', {}, getToken());
        if (!result.success) { showError('events-error', result.error || 'Could not load events.'); document.getElementById('events-list').innerHTML = ''; return; }
        allEvents = result.data.events || [];
        renderEventsList();
      } catch (err) {
        showError('events-error', 'Connection error.');
        document.getElementById('events-list').innerHTML = '';
      }
    }

    function renderEventsList() {
      const list = document.getElementById('events-list');
      if (!allEvents.length) {
        list.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;font-style:italic;">No events yet.</div>';
        return;
      }
      const order = { active: 0, upcoming: 1, completed: 2, cancelled: 3 };
      const sorted = allEvents.slice().sort(function(a, b) {
        if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
        return a.event_date > b.event_date ? -1 : 1;
      });
      list.innerHTML = sorted.map(renderEventItem).join('');
    }

    function renderEventItem(ev) {
      const dateStr = ev.event_date ? ev.event_date.toString().split('T')[0] : '—';
      return [
        '<div class="event-item" id="evitem-' + ev.event_id + '">',
          '<div class="event-item-header" onclick="toggleEventItem(\'' + ev.event_id + '\')">',
            '<div class="event-item-left">',
              '<div class="event-item-name">' + escHtml(ev.event_name) + '</div>',
              '<div class="event-item-meta">' + dateStr + ' &middot; ' + escHtml(ev.location_name || '') + '</div>',
            '</div>',
            '<div class="event-item-right">',
              '<span class="status-badge status-' + ev.status + '">' + ev.status + '</span>',
              '<span class="expand-arrow">▼</span>',
            '</div>',
          '</div>',
          '<div class="event-item-body" id="evbody-' + ev.event_id + '">',
            renderEventBody(ev),
          '</div>',
        '</div>'
      ].join('');
    }

    function renderTimerSection(ev) {
      if (ev.status !== 'active') {
        return '<div class="no-segments">Timer only available on active events.</div>';
      }
      if (ev.collection_start_time) {
        return '<div class="timer-started">✓ Timer started — ' + ev.collection_start_time.toString().split('T')[0] + ' ' + ev.collection_start_time.toString().split('T')[1].substring(0, 5) + '</div>';
      }
      return '<button class="btn btn-primary btn-sm" onclick="handleStartCollectionTimer(\'' + ev.event_id + '\')" style="align-self:flex-start; width:auto; padding:9px 20px;">Start Collection Timer</button>';
    }
    function renderEventBody(ev) {
      const statuses = ['upcoming', 'active', 'completed', 'cancelled'];
      const statusBtns = statuses.map(function(s) {
        return '<button class="status-btn' + (s === ev.status ? ' current' : '') +
               '" onclick="handleStatusChange(\'' + ev.event_id + '\',\'' + s + '\')">' + s + '</button>';
      }).join('');

      return [
        '<div class="event-body-label">Status</div>',
        '<div class="status-controls">' + statusBtns + '</div>',
        '<div class="event-body-label">Collection Timer</div>',
        renderTimerSection(ev),
        '<div class="event-body-label">Returns</div>',
        '<div class="collection-status-list" id="colstatus-' + ev.event_id + '">',
          ev.status === 'active' ? '<div class="no-segments">Loading...</div>' : '<div class="no-segments">Event not active.</div>',
        '</div>',
        '<div class="event-body-label">Segments</div>',
        '<button class="view-on-map-btn" onclick="viewEventOnMap(\'' + ev.event_id + '\')">View on Map →</button>',
        '<div class="segment-list" id="seglist-' + ev.event_id + '">',
          '<div class="no-segments">Loading...</div>',
        '</div>',
      ].join('');
    }

    function toggleEventItem(eventId) {
      const item = document.getElementById('evitem-' + eventId);
      const wasOpen = item.classList.contains('open');
      document.querySelectorAll('.event-item.open').forEach(function(el) { el.classList.remove('open'); });
      if (!wasOpen) { 
        item.classList.add('open'); 
        loadEventSegmentList(eventId);
        loadCollectionStatus(eventId);
      }
    }

    async function loadEventSegmentList(eventId) {
      const listEl = document.getElementById('seglist-' + eventId);
      if (!listEl) return;
      try {
        const result = await apiCall('getEventSegments', { event_id: eventId }, getToken());
        if (!result.success) { listEl.innerHTML = '<div class="no-segments">Could not load.</div>'; return; }
        const segs = result.data.segments || [];
        assignedSegmentIds[eventId] = segs.map(function(s) { return s.segment_id; });

        if (!segs.length) {
          listEl.innerHTML = '<div class="no-segments">No segments assigned. Use the Map tab to assign segments to this event.</div>';
          return;
        }
        listEl.innerHTML = segs.map(function(seg) {
          return [
            '<div class="segment-item">',
              '<div>',
                '<div class="segment-item-name">' + escHtml(seg.street_name) + '</div>',
                '<div class="segment-item-meta">',
                  escHtml(seg.from_cross_street || '') +
                  (seg.to_cross_street ? ' → ' + escHtml(seg.to_cross_street) : '') +
                  ' &middot; ' + (seg.length_mi || '?') + ' mi',
                '</div>',
              '</div>',
              '<button class="btn-icon" onclick="handleRemoveSegment(\'' + seg.event_segment_id + '\',\'' + eventId + '\')">Remove</button>',
            '</div>'
          ].join('');
        }).join('');
      } catch (err) {
        listEl.innerHTML = '<div class="no-segments">Connection error.</div>';
      }
    }

    async function handleStatusChange(eventId, newStatus) {
      try {
        const result = await apiCall('updateEventStatus', { event_id: eventId, status: newStatus }, getToken());
        if (!result.success) { alert(result.error); return; }
        await loadEvents();
        const item = document.getElementById('evitem-' + eventId);
        if (item) { item.classList.add('open'); loadEventSegmentList(eventId); }
        populateMapEventSelect();
      } catch (err) { alert('Connection error.'); }
    }

    async function handleRemoveSegment(eventSegmentId, eventId) {
      try {
        const result = await apiCall('removeSegment', { event_segment_id: eventSegmentId }, getToken());
        if (!result.success) { alert(result.error); return; }
        loadEventSegmentList(eventId);
        if (mapInitialized) {
          delete assignedSegmentIds[eventId];
          refreshSegmentColors();
        }
      } catch (err) { alert('Connection error.'); }
    }

    async function handleStartCollectionTimer(eventId) {
      if (!confirm('Start the collection timer for this event? This cannot be undone.')) return;
      try {
        const result = await apiCall('startCollectionTimer', { event_id: eventId }, getToken());
        if (!result.success) { alert(result.error); return; }
        await loadEvents();
        const item = document.getElementById('evitem-' + eventId);
        if (item) { item.classList.add('open'); loadCollectionStatus(eventId); }
      } catch (err) { alert('Connection error.'); }
    }

    async function loadCollectionStatus(eventId) {
      const listEl = document.getElementById('colstatus-' + eventId);
      if (!listEl) return;
      try {
        const result = await apiCall('getCollectionStatus', { event_id: eventId }, getToken());
        if (!result.success) { listEl.innerHTML = '<div class="no-segments">Could not load.</div>'; return; }
        const data = result.data;
        if (!data.timer_started) {
          listEl.innerHTML = '<div class="no-segments">Timer not started yet.</div>';
          return;
        }
        if (!data.collections || !data.collections.length) {
          listEl.innerHTML = '<div class="no-segments">No returns yet.</div>';
          return;
        }
        listEl.innerHTML = data.collections.map(function(c) {
          return [
            '<div class="segment-item">',
              '<div>',
                '<div class="segment-item-name">' + escHtml(c.preferred_name) + ' <span style="color:var(--text-muted);font-size:0.78rem;">@' + escHtml(c.username) + '</span></div>',
                '<div class="segment-item-meta">',
                  c.collection_duration_hours + ' hrs &middot; ' + c.total_weight_lbs + ' lbs',
                '</div>',
              '</div>',
              '<span style="color:var(--accent);font-size:0.8rem;font-weight:700;">RETURNED</span>',
            '</div>'
          ].join('');
        }).join('');
      } catch (err) {
        listEl.innerHTML = '<div class="no-segments">Connection error.</div>';
      }
    }
    
    // ── CREATE EVENT ─────────────────────────
    var createFormOpen = false;

    function toggleCreateForm() {
      createFormOpen = !createFormOpen;
      document.getElementById('create-form').style.display = createFormOpen ? 'flex' : 'none';
      document.getElementById('create-toggle').textContent = createFormOpen ? '✕ Cancel' : '+ New Event';
    }

    async function handleCreateEvent() {
      hideMsg('create-error'); hideMsg('create-success');
      const name      = document.getElementById('new-name').value.trim();
      const date      = document.getElementById('new-date').value.trim();
      const watershed = document.getElementById('new-watershed').value.trim();
      const location  = document.getElementById('new-location').value.trim();
      const lat       = document.getElementById('new-lat').value.trim();
      const lon       = document.getElementById('new-lon').value.trim();
      const notes     = document.getElementById('new-notes').value.trim();

      if (!name)      return showError('create-error', 'Event name is required.');
      if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return showError('create-error', 'Date must be YYYY-MM-DD.');
      if (!watershed) return showError('create-error', 'Watershed is required.');
      if (!location)  return showError('create-error', 'Location name is required.');
      if (!lat || !lon) return showError('create-error', 'Latitude and longitude are required.');

      const btn = document.getElementById('btn-create');
      btn.classList.add('loading');
      try {
        const result = await apiCall('createEvent', {
          event_name: name, event_date: date, location_name: location,
          latitude: parseFloat(lat), longitude: parseFloat(lon),
          watershed: watershed, notes: notes
        }, getToken());
        if (!result.success) { showError('create-error', result.error || 'Could not create event.'); return; }
        showSuccess('create-success', 'Event created.');
        ['new-name','new-date','new-watershed','new-location','new-lat','new-lon','new-notes']
          .forEach(function(id) { document.getElementById(id).value = ''; });
        toggleCreateForm();
        loadEvents();
        populateMapEventSelect();
      } catch (err) {
        showError('create-error', 'Connection error.');
      } finally {
        btn.classList.remove('loading');
      }
    }

    // ── MAP ───────────────────────────────────
    var map = null;
    var mapInitialized = false;
    var mapMode = 'none'; // 'none' | 'draw' | 'assign'

    // Draw state
    var drawStep = 0;
    var startMarker = null;
    var endMarker = null;
    var drawPolyline = null;
    var pendingSegment = null;

    // Segment layers: [{ segmentId, layer }]
    var segmentLayers = [];

    function initMap() {
      if (mapInitialized) return;
      mapInitialized = true;
      map = L.map('map', { zoomControl: true }).setView(MAP_CENTER, MAP_ZOOM);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19
      }).addTo(map);
      map.on('click', onMapClick);
      loadSegmentsOnMap();
    }

    async function loadSegmentsOnMap() {
      try {
        const result = await apiCall('getSegments', {}, getToken());
        if (!result.success) return;
        allSegments = result.data.segments || [];
        renderSegmentsOnMap();
      } catch (err) {}
    }

    function renderSegmentsOnMap() {
      segmentLayers.forEach(function(entry) { map.removeLayer(entry.layer); });
      segmentLayers = [];

      allSegments.forEach(function(seg) {
        if (!seg.start_lat || !seg.end_lat) return;
        const layer = L.polyline(
          [[seg.start_lat, seg.start_lon], [seg.end_lat, seg.end_lon]],
          { color: COLOR_UNASSIGNED, weight: 4, opacity: 0.8 }
        ).addTo(map);

        layer.bindPopup(
          '<strong>' + escHtml(seg.street_name) + '</strong><br/>' +
          (seg.from_cross_street ? escHtml(seg.from_cross_street) + ' → ' + escHtml(seg.to_cross_street) + '<br/>' : '') +
          (seg.length_mi || '?') + ' mi'
        );

        layer.on('click', function(e) {
          if (mapMode === 'assign') {
            L.DomEvent.stopPropagation(e);
            handleSegmentAssignClick(seg.segment_id);
          }
        });

        segmentLayers.push({ segmentId: seg.segment_id, layer: layer });
      });

      refreshSegmentColors();
    }

    function refreshSegmentColors() {
      const selectedEventId = document.getElementById('map-event-select').value;
      const assigned = selectedEventId ? (assignedSegmentIds[selectedEventId] || []) : [];
      segmentLayers.forEach(function(entry) {
        const isAssigned = assigned.indexOf(entry.segmentId) !== -1;
        entry.layer.setStyle({ color: isAssigned ? COLOR_ASSIGNED : COLOR_UNASSIGNED });
      });
    }

    // ── MAP EVENT SELECT ─────────────────────
    async function onEventSelectChange() {
      const eventId = document.getElementById('map-event-select').value;
      const assignBtn = document.getElementById('btn-assign');
      if (eventId) {
        assignBtn.disabled = false;
        if (!assignedSegmentIds[eventId]) {
          try {
            const result = await apiCall('getEventSegments', { event_id: eventId }, getToken());
            if (result.success) {
              assignedSegmentIds[eventId] = (result.data.segments || []).map(function(s) { return s.segment_id; });
            }
          } catch (err) {}
        }
      } else {
        assignBtn.disabled = true;
        if (mapMode === 'assign') exitAssignMode();
      }
      refreshSegmentColors();
    }

    // ── DRAW MODE ────────────────────────────
    function toggleDrawMode() {
      if (mapMode === 'draw') { cancelSegment(); }
      else { if (mapMode === 'assign') exitAssignMode(); enterDrawMode(); }
    }

    function enterDrawMode() {
      mapMode = 'draw'; drawStep = 1;
      document.getElementById('btn-draw').classList.add('active-mode');
      document.getElementById('btn-draw').textContent = 'Cancel';
      map.getContainer().style.cursor = 'crosshair';
      setModeBar('draw', 'Draw Mode — click the start point of the segment');
      showSegPanel('Click the start point of the segment.');
    }

    function exitDrawMode() {
      mapMode = 'none'; drawStep = 0;
      document.getElementById('btn-draw').classList.remove('active-mode');
      document.getElementById('btn-draw').textContent = '+ Segment';
      map.getContainer().style.cursor = '';
      hideModeBar();
    }

    // ── ASSIGN MODE ──────────────────────────
    function toggleAssignMode() {
      if (mapMode === 'assign') { exitAssignMode(); }
      else { if (mapMode === 'draw') cancelSegment(); enterAssignMode(); }
    }

    function enterAssignMode() {
      mapMode = 'assign';
      document.getElementById('btn-assign').classList.add('active-mode');
      document.getElementById('btn-assign').textContent = 'Done';
      map.getContainer().style.cursor = 'pointer';
      setModeBar('assign', 'Assign Mode — tap segments to assign / unassign');
    }

    function exitAssignMode() {
      mapMode = 'none';
      document.getElementById('btn-assign').classList.remove('active-mode');
      document.getElementById('btn-assign').textContent = 'Assign';
      map.getContainer().style.cursor = '';
      hideModeBar();
    }

    async function handleSegmentAssignClick(segmentId) {
      const eventId = document.getElementById('map-event-select').value;
      if (!eventId) return;
      const assigned = assignedSegmentIds[eventId] || [];
      const isAssigned = assigned.indexOf(segmentId) !== -1;

      if (isAssigned) {
        try {
          const result = await apiCall('getEventSegments', { event_id: eventId }, getToken());
          if (!result.success) return;
          const seg = result.data.segments.find(function(s) { return s.segment_id === segmentId; });
          if (!seg) return;
          await apiCall('removeSegment', { event_segment_id: seg.event_segment_id }, getToken());
          assignedSegmentIds[eventId] = assigned.filter(function(id) { return id !== segmentId; });
        } catch (err) {}
      } else {
        try {
          const result = await apiCall('assignSegment', { event_id: eventId, segment_id: segmentId }, getToken());
          if (!result.success) { alert(result.error); return; }
          assignedSegmentIds[eventId] = assigned.concat([segmentId]);
        } catch (err) {}
      }
      refreshSegmentColors();
    }

    // ── MAP CLICK ────────────────────────────
    async function onMapClick(e) {
      if (mapMode !== 'draw') return;
      const lat = e.latlng.lat, lon = e.latlng.lng;
      setMapLoading(true);
      try {
        const snapped = await snapToNearestIntersection(lat, lon);
        const snapLat = snapped ? snapped.lat : lat;
        const snapLon = snapped ? snapped.lon : lon;

        if (drawStep === 1) {
          if (startMarker) map.removeLayer(startMarker);
          startMarker = L.marker([snapLat, snapLon], { draggable: true, icon: makeIcon('#b5f033', 'S') }).addTo(map);
          startMarker.on('dragend', updateDrawLine);
          const streetInfo = await reverseGeocode(snapLat, snapLon);
          if (streetInfo) {
            document.getElementById('seg-street').value = streetInfo.road || '';
            const evWatershed = getWatershedForEvent(document.getElementById('map-event-select').value);
            if (evWatershed) document.getElementById('seg-watershed').value = evWatershed;
            if (snapped && snapped.crossStreet) document.getElementById('seg-from').value = snapped.crossStreet;
          }
          drawStep = 2;
          updateSegHint('Start placed. Now click the end point.');

        } else if (drawStep === 2) {
          if (endMarker) map.removeLayer(endMarker);
          endMarker = L.marker([snapLat, snapLon], { draggable: true, icon: makeIcon('#ff5c5c', 'E') }).addTo(map);
          endMarker.on('dragend', updateDrawLine);
          if (snapped && snapped.crossStreet) document.getElementById('seg-to').value = snapped.crossStreet;
          updateDrawLine();
          drawStep = 0;
          updateSegHint('Adjust markers if needed, then save.');
          setModeBar('draw', 'Draw Mode — adjust endpoints or save segment');
        }
      } catch (err) {
        updateSegHint('Could not snap to road. Marker placed at click point.');
      } finally {
        setMapLoading(false);
      }
    }

    function updateDrawLine() {
      if (!startMarker || !endMarker) return;
      const start = startMarker.getLatLng(), end = endMarker.getLatLng();
      if (drawPolyline) map.removeLayer(drawPolyline);
      drawPolyline = L.polyline([[start.lat, start.lng],[end.lat, end.lng]], {
        color: COLOR_UNASSIGNED, weight: 4, dashArray: '6 4', opacity: 0.9
      }).addTo(map);
      const dist = haversine(start.lat, start.lng, end.lat, end.lng);
      document.getElementById('seg-length').textContent = dist + ' mi';
      pendingSegment = { start_lat: start.lat, start_lon: start.lng, end_lat: end.lat, end_lon: end.lng, length_mi: parseFloat(dist) };
    }

    function cancelSegment() {
      exitDrawMode();
      pendingSegment = null;
      if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
      if (endMarker)   { map.removeLayer(endMarker);   endMarker = null; }
      if (drawPolyline){ map.removeLayer(drawPolyline); drawPolyline = null; }
      document.getElementById('seg-panel').classList.remove('visible');
      hideMsg('seg-error');
      ['seg-street','seg-from','seg-to','seg-watershed'].forEach(function(id) { document.getElementById(id).value = ''; });
      document.getElementById('seg-length').textContent = '—';
    }

    async function handleSaveSegment() {
      hideMsg('seg-error');
      if (!pendingSegment) { showError('seg-error', 'Place start and end points first.'); return; }
      const streetName = document.getElementById('seg-street').value.trim();
      const watershed  = document.getElementById('seg-watershed').value.trim();
      if (!streetName) return showError('seg-error', 'Street name is required.');
      if (!watershed)  return showError('seg-error', 'Watershed is required.');

      const btn = document.getElementById('btn-save-seg');
      btn.classList.add('loading');
      try {
        const result = await apiCall('createSegment', {
          street_name:       streetName,
          from_cross_street: document.getElementById('seg-from').value.trim(),
          to_cross_street:   document.getElementById('seg-to').value.trim(),
          start_lat:  pendingSegment.start_lat,
          start_lon:  pendingSegment.start_lon,
          end_lat:    pendingSegment.end_lat,
          end_lon:    pendingSegment.end_lon,
          length_mi:  pendingSegment.length_mi,
          is_custom_length: false,
          watershed:  watershed
        }, getToken());

        if (!result.success) { showError('seg-error', result.error || 'Could not save segment.'); return; }

        const selectedEventId = document.getElementById('map-event-select').value;
        if (selectedEventId && result.data.segment_id) {
          const assignResult = await apiCall('assignSegment', {
            event_id: selectedEventId, segment_id: result.data.segment_id
          }, getToken());
          if (assignResult.success) {
            const assigned = assignedSegmentIds[selectedEventId] || [];
            assignedSegmentIds[selectedEventId] = assigned.concat([result.data.segment_id]);
          }
        }

        await loadSegmentsOnMap();
        cancelSegment();
      } catch (err) {
        showError('seg-error', 'Connection error.');
      } finally {
        btn.classList.remove('loading');
      }
    }

    // ── MODE BAR ─────────────────────────────
    function setModeBar(mode, text) {
      const bar = document.getElementById('map-mode-bar');
      bar.textContent = text;
      bar.className = 'map-mode-bar visible ' + mode;
    }

    function hideModeBar() { document.getElementById('map-mode-bar').classList.remove('visible'); }

    // ── OSM SNAP ─────────────────────────────
    async function snapToNearestIntersection(lat, lon) {
      const query = '[out:json][timeout:15];(way(around:50,' + lat + ',' + lon + ')["highway"];);(._;>;);out body;';
      const res = await fetch(OVERPASS_URL, { method: 'POST', body: 'data=' + encodeURIComponent(query) });
      const data = await res.json();
      if (!data.elements || !data.elements.length) return null;

      const nodes = {}, ways = [];
      data.elements.forEach(function(el) {
        if (el.type === 'node') nodes[el.id] = el;
        if (el.type === 'way')  ways.push(el);
      });

      const nodeWayCount = {};
      ways.forEach(function(way) {
        (way.nodes || []).forEach(function(nid) { nodeWayCount[nid] = (nodeWayCount[nid] || 0) + 1; });
      });

      let clickedWay = null, minDist = Infinity;
      ways.forEach(function(way) {
        (way.nodes || []).forEach(function(nid) {
          const node = nodes[nid]; if (!node) return;
          const d = haversineRaw(lat, lon, node.lat, node.lon);
          if (d < minDist) { minDist = d; clickedWay = way; }
        });
      });

      if (!clickedWay) return null;

      let nearestIntersection = null, nearestDist = Infinity;
      let nearestNode = null, nearestNodeDist = Infinity;

      clickedWay.nodes.forEach(function(nid) {
        const node = nodes[nid]; if (!node) return;
        const d = haversineRaw(lat, lon, node.lat, node.lon);
        if (d < nearestNodeDist) { nearestNodeDist = d; nearestNode = node; }
        if (nodeWayCount[nid] > 1 && d < nearestDist) { nearestDist = d; nearestIntersection = node; }
      });

      const snapNode = nearestIntersection || nearestNode;
      if (!snapNode) return null;

      let crossStreet = null;
      if (nearestIntersection) {
        const otherWay = ways.find(function(w) {
          return w.id !== clickedWay.id && w.nodes.indexOf(nearestIntersection.id) !== -1;
        });
        if (otherWay && otherWay.tags && otherWay.tags.name) crossStreet = otherWay.tags.name;
      }

      return { lat: snapNode.lat, lon: snapNode.lon, crossStreet: crossStreet };
    }

    // ── NOMINATIM ────────────────────────────
    async function reverseGeocode(lat, lon) {
      try {
        const res = await fetch(NOMINATIM_URL + '?lat=' + lat + '&lon=' + lon + '&format=json', { headers: { 'Accept-Language': 'en' } });
        const data = await res.json();
        return data.address || null;
      } catch (err) { return null; }
    }

    // ── HAVERSINE ────────────────────────────
    function haversine(lat1, lon1, lat2, lon2) {
      return Math.round(haversineRaw(lat1, lon1, lat2, lon2) / 1609.344 * 100) / 100;
    }

    function haversineRaw(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // ── MAP HELPERS ──────────────────────────
    function makeIcon(color, letter) {
      return L.divIcon({
        className: '',
        html: '<div style="background:' + color + ';color:#0f1210;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;font-family:sans-serif;border:2px solid #0f1210;">' + letter + '</div>',
        iconSize: [24, 24], iconAnchor: [12, 12]
      });
    }

    function setMapLoading(visible) { document.getElementById('map-loading').classList.toggle('visible', visible); }
    function showSegPanel(hint)     { document.getElementById('seg-panel').classList.add('visible'); updateSegHint(hint); }
    function updateSegHint(msg)     { document.getElementById('seg-hint').textContent = msg; }

    function getWatershedForEvent(eventId) {
      const ev = allEvents.find(function(e) { return e.event_id === eventId; });
      return ev ? (ev.watershed || '') : '';
    }

    async function populateMapEventSelect() {
      try {
        const result = await apiCall('getEvents', {}, getToken());
        if (!result.success) return;
        allEvents = result.data.events || [];
        const sel = document.getElementById('map-event-select');
        const current = sel.value;
        sel.innerHTML = '<option value="">— Select event —</option>';
        allEvents.filter(function(ev) {
          return ev.status === 'upcoming' || ev.status === 'active';
        }).forEach(function(ev) {
          const opt = document.createElement('option');
          opt.value = ev.event_id;
          opt.textContent = ev.event_name + ' (' + ev.status + ')';
          if (ev.event_id === current) opt.selected = true;
          sel.appendChild(opt);
        });
        document.getElementById('btn-assign').disabled = !sel.value;
      } catch (err) {}
    }

    // ── UTILITIES ────────────────────────────
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── ON LOAD ──────────────────────────────
    window.addEventListener('load', function() {
      document.getElementById('login-password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleLogin();
      });
      if (getToken()) {
        showDashboard();
        loadEvents();
        populateMapEventSelect();
      } else {
        showLogin();
      }
    });
  </script>

</body>
