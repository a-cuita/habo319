<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volunteer Check-in</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="brand">
  <h1><span aria-hidden="true">🌱</span> Volunteer Check-in</h1>
</header>

<main>
  <!-- Public view: "coming soon", with a quiet way in for reviewers. -->
  <div id="gate">
    <section class="card">
      <h2>Coming soon</h2>
      <p class="muted">Volunteer check-in is being set up. Please check back soon.</p>
    </section>
    <div class="center"><button class="link-btn" id="show-code" type="button">Have an access code?</button></div>
    <form class="card" id="code-form" hidden>
      <div class="ig">
        <label for="code">Access code</label>
        <input id="code" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
      <button class="btn btn-primary" type="submit">Continue</button>
      <p class="err" id="code-err" role="alert"></p>
    </form>
  </div>

  <!-- Reviewer view: questions come from the Sheet's "Preview Questions" tab. -->
  <form id="survey" hidden>
    <section class="card"><p id="intro"></p></section>
    <section class="card">
      <div class="ig">
        <label for="name">Your name</label>
        <input id="name" autocomplete="name">
      </div>
    </section>
    <div id="questions"></div>
    <button class="btn btn-accent" type="submit">Send answers</button>
    <p class="err" id="survey-err" role="alert"></p>
  </form>

  <section class="card" id="thanks" hidden>
    <h2>Thank you</h2>
    <p class="muted" id="thanks-msg"></p>
    <button class="btn btn-secondary" type="button" id="again">Answer again</button>
  </section>

  <!-- Event check-in (phone or iPad), drawn by assets/checkin.js. -->
  <div id="checkin" hidden></div>
</main>

<script src="config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/preview.js"></script>
<script src="assets/checkin.js"></script>
<script>
  // ?e=CODE is an event's check-in page (add &kiosk=1 for the event iPad);
  // anything else is the home page.
  if (new URLSearchParams(location.search).get('e')) CheckIn.start(); else Preview.start();
</script>
</body>
</html>
