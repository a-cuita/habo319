<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HABO Cleanup — Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:        #0f1210;
      --surface:   #1a1f1c;
      --border:    #2e3530;
      --accent:    #b5f033;
      --text:      #f0f4f1;
      --text-muted:#8a9e8f;
      --font-head: 'Barlow Condensed', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .icon {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 24px;
    }

    .title {
      font-family: var(--font-head);
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 320px;
    }


  </style>
</head>

<body>
  <div class="icon">🌿</div>
  <div class="title">Unavailable</div>
  <div class="subtitle">This site is currently offline. Please check back later.</div>
</body>
</html>
