<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f2f2f7; --surface: #fff; --surface-2: #f0f0f5; --border: #d1d1d6;
    --primary: #2563eb; --primary-dim: #dbeafe; --accent: #2c8a3d; --accent-dim: #d4f1dc;
    --danger: #dc2626; --text: #1c1c1e; --text-dim: #6e6e73;
    --radius: 12px; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font); color: var(--text); background: var(--bg); font-size: 14px; line-height: 1.45; }
  button, input { font: inherit; }
  [hidden] { display: none !important; }

  .layout { display: grid; grid-template-columns: 400px 1fr; height: 100%; }
  .left { border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  .right { display: flex; flex-direction: column; min-height: 0; padding: 14px 18px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .right .bar { padding: 0 0 12px; border: 0; }
  h1 { font-size: 1.1rem; font-weight: 800; }
  .scroll { overflow-y: auto; flex: 1; padding: 12px 16px 20px; }

  .btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 7px 12px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn:disabled { opacity: 0.55; cursor: default; }

  .group { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-dim); margin: 14px 0 6px; }
  .group:first-child { margin-top: 0; }
  .event { border: 1.5px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; cursor: pointer; position: relative; }
  .event.on { border-color: var(--primary); background: var(--primary-dim); }
  .event .name { font-weight: 700; padding-right: 50px; }
  .event .meta { color: var(--text-dim); font-size: 0.85rem; }
  .event .code { font-family: ui-monospace, Menlo, monospace; font-size: 0.78rem; color: var(--primary); font-weight: 700; letter-spacing: 1px; }
  .event .edit { position: absolute; top: 8px; right: 8px; padding: 3px 9px; font-size: 0.8rem; }
  .empty { color: var(--text-dim); text-align: center; padding: 30px 10px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
  .field input { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { color: var(--text-dim); font-size: 0.85rem; margin: -4px 0 12px; }
  .actions { display: flex; gap: 8px; }
  .error { color: var(--danger); font-size: 0.88rem; margin-top: 10px; }
  .error:empty { display: none; }

  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; padding: 6px 14px; font-weight: 600; cursor: pointer; color: var(--text-dim); }
  .seg button.on { background: var(--primary); color: #fff; }
  .selected { font-weight: 700; margin-bottom: 4px; }
  .selected small { font-weight: 400; color: var(--text-dim); }

  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .device { border: 10px solid #1c1c1e; border-radius: 28px; overflow: hidden; background: #fff; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18); }
  .device iframe { border: 0; display: block; transform-origin: 0 0; background: #fff; }

  .qr { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
  .qr-box { width: min(380px, 60vh); background: #fff; padding: 14px; border-radius: var(--radius); border: 1px solid var(--border); }
  .qr-box svg { display: block; width: 100%; height: auto; }
  .qr-name { font-size: 1.1rem; font-weight: 800; }
  .link-row { display: flex; gap: 6px; width: min(520px, 100%); }
  .link-row input { flex: 1; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem; }
  .muted { color: var(--text-dim); font-size: 0.85rem; }
</style>
<?!= include('QrLib'); ?>
</head>
<body>
<div class="layout">

  <section class="left">
    <div class="bar">
      <h1 id="left-title">Events</h1>
      <button class="btn primary" id="new-btn" type="button">+ New event</button>
    </div>

    <div class="scroll" id="list-view">
      <div id="list"><div class="empty">Loading…</div></div>
      <p class="error" id="list-error"></p>
    </div>

    <form class="scroll" id="form" hidden novalidate>
      <input type="hidden" id="f-id">
      <div class="field"><label for="f-name">Event name</label><input id="f-name" maxlength="120" placeholder="e.g. Cypress Creek cleanup"></div>
      <div class="field"><label for="f-date">Date</label><input id="f-date" type="date"></div>
      <div class="row">
        <div class="field"><label for="f-start">Start</label><input id="f-start" type="time" step="300"></div>
        <div class="field"><label for="f-end">End</label><input id="f-end" type="time" step="300"></div>
      </div>
      <p class="hint" id="f-hours"></p>
      <div class="field"><label for="f-location">Location</label><input id="f-location" maxlength="200" placeholder="Optional"></div>
      <div class="actions">
        <button class="btn primary" type="submit" id="save-btn">Save event</button>
        <button class="btn" type="button" id="cancel-btn">Cancel</button>
      </div>
      <p class="error" id="form-error"></p>
    </form>
  </section>

  <section class="right">
    <div class="bar">
      <div class="seg" id="views">
        <button type="button" data-view="preview" class="on">Preview</button>
        <button type="button" data-view="qr">QR code</button>
      </div>
      <div class="seg" id="devices">
        <button type="button" data-device="phone" class="on">Phone</button>
        <button type="button" data-device="ipad">iPad</button>
      </div>
    </div>
    <div class="selected" id="selected"></div>

    <div class="stage" id="preview-view">
      <div class="device" id="device"><iframe id="frame" title="Live preview of the public site"></iframe></div>
    </div>

    <div class="qr" id="qr-view" hidden>
      <div class="qr-name" id="qr-name"></div>
      <div class="qr-box" id="qr-box"></div>
      <div class="link-row">
        <input id="qr-url" readonly aria-label="Check-in link">
        <button class="btn" type="button" id="copy-btn">Copy link</button>
        <a class="btn" id="open-link" target="_blank" rel="noopener">Open</a>
      </div>
      <p class="muted">Scanning this code opens the public site for this event only.</p>
    </div>
  </section>

</div>

<script>
(function () {
  'use strict';

  var DEVICES = { phone: { w: 390, h: 844 }, ipad: { w: 1180, h: 820 } };
  var state = { events: [], publicUrl: '', selectedId: null, view: 'preview', device: 'phone' };

  function $(id) { return document.getElementById(id); }

  // google.script.run as a promise.
  function call(fn, arg) {
    return new Promise(function (resolve, reject) {
      var run = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      if (arg === undefined) run[fn](); else run[fn](arg);
    });
  }

  /* ── Formatting ── */

  function todayYmd() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function fmtDate(ymd) {
    if (!ymd) return 'No date';
    var p = ymd.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }

  function fmtTime(hm) {
    if (!hm) return '?';
    var p = hm.split(':').map(Number);
    return (p[0] % 12 || 12) + ':' + ('0' + p[1]).slice(-2) + (p[0] < 12 ? ' AM' : ' PM');
  }

  function hoursBetween(start, end) {
    if (!start || !end) return null;
    var a = start.split(':').map(Number), b = end.split(':').map(Number);
    return ((b[0] * 60 + b[1]) - (a[0] * 60 + a[1])) / 60;
  }

  function fmtHours(h) {
    var n = Math.round(h * 100) / 100;
    return n + (n === 1 ? ' hour' : ' hours');
  }

  function checkinUrl(ev) {
    var url = new URL(state.publicUrl);
    if (ev) url.searchParams.set('e', ev.code);
    return url.toString();
  }

  function selected() {
    return state.events.filter(function (e) { return e.id === state.selectedId; })[0] || null;
  }

  /* ── Events list ── */

  function load(selectId) {
    return call('adminGetEvents').then(function (data) { apply(data, selectId); })
      .catch(function (err) { $('list-error').textContent = err.message || String(err); });
  }

  function apply(data, selectId) {
    state.events = data.events;
    state.publicUrl = data.publicUrl;
    if (selectId) state.selectedId = selectId;
    if (!selected()) {
      var upcoming = sorted().upcoming;
      state.selectedId = upcoming.length ? upcoming[0].id : (state.events[0] ? state.events[0].id : null);
    }
    renderList();
    renderRight();
  }

  // Upcoming soonest-first, then past most-recent-first.
  function sorted() {
    var today = todayYmd();
    var upcoming = state.events.filter(function (e) { return e.date && e.date >= today; });
    var past = state.events.filter(function (e) { return !e.date || e.date < today; });
    upcoming.sort(function (a, b) { return (a.date + a.start).localeCompare(b.date + b.start); });
    past.sort(function (a, b) { return (b.date + b.start).localeCompare(a.date + a.start); });
    return { upcoming: upcoming, past: past };
  }

  function renderList() {
    var list = $('list');
    list.textContent = '';
    if (!state.events.length) {
      list.innerHTML = '<div class="empty">No events yet.<br>Tap <b>+ New event</b> to add one.</div>';
      return;
    }
    var groups = sorted();
    [['Upcoming', groups.upcoming], ['Past', groups.past]].forEach(function (g) {
      if (!g[1].length) return;
      var h = document.createElement('div');
      h.className = 'group';
      h.textContent = g[0];
      list.appendChild(h);
      g[1].forEach(function (ev) { list.appendChild(eventCard(ev)); });
    });
  }

  function eventCard(ev) {
    var card = document.createElement('div');
    card.className = 'event' + (ev.id === state.selectedId ? ' on' : '');
    card.dataset.id = ev.id;

    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = ev.name;
    var when = document.createElement('div');
    when.className = 'meta';
    var hours = hoursBetween(ev.start, ev.end);
    when.textContent = fmtDate(ev.date) + ' · ' + fmtTime(ev.start) + ' – ' + fmtTime(ev.end) +
      (hours > 0 ? ' · ' + fmtHours(hours) : '');
    card.appendChild(name);
    card.appendChild(when);
    if (ev.location) {
      var loc = document.createElement('div');
      loc.className = 'meta';
      loc.textContent = ev.location;
      card.appendChild(loc);
    }
    var code = document.createElement('div');
    code.className = 'code';
    code.textContent = ev.code;
    card.appendChild(code);

    var edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'btn edit';
    edit.textContent = 'Edit';
    edit.addEventListener('click', function (e) { e.stopPropagation(); openForm(ev); });
    card.appendChild(edit);

    card.addEventListener('click', function () { select(ev.id); });
    return card;
  }

  function select(id) {
    state.selectedId = id;
    document.querySelectorAll('.event').forEach(function (c) { c.classList.toggle('on', c.dataset.id === id); });
    renderRight();
  }

  /* ── Create / edit form ── */

  function openForm(ev) {
    $('left-title').textContent = ev ? 'Edit event' : 'New event';
    $('f-id').value = ev ? ev.id : '';
    $('f-name').value = ev ? ev.name : '';
    $('f-date').value = ev ? ev.date : '';
    $('f-start').value = ev ? ev.start : '';
    $('f-end').value = ev ? ev.end : '';
    $('f-location').value = ev ? ev.location : '';
    $('form-error').textContent = '';
    updateHoursHint();
    $('list-view').hidden = true;
    $('new-btn').hidden = true;
    $('form').hidden = false;
    if (ev) select(ev.id);
    $('f-name').focus();
  }

  function closeForm() {
    $('left-title').textContent = 'Events';
    $('form').hidden = true;
    $('list-view').hidden = false;
    $('new-btn').hidden = false;
  }

  function updateHoursHint() {
    var h = hoursBetween($('f-start').value, $('f-end').value);
    $('f-hours').textContent = h === null ? '' :
      h > 0 ? 'Volunteers get ' + fmtHours(h) + ' for this event.' : 'The end time has to be after the start time.';
  }

  $('new-btn').addEventListener('click', function () { openForm(null); });
  $('cancel-btn').addEventListener('click', closeForm);
  $('f-start').addEventListener('input', updateHoursHint);
  $('f-end').addEventListener('input', updateHoursHint);

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = {
      id: $('f-id').value,
      name: $('f-name').value.trim(),
      date: $('f-date').value,
      start: $('f-start').value,
      end: $('f-end').value,
      location: $('f-location').value.trim()
    };
    var btn = $('save-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    $('form-error').textContent = '';
    call('adminSaveEvent', input)
      .then(function (data) { closeForm(); apply(data, data.savedId); })
      .catch(function (err) { $('form-error').textContent = err.message || String(err); })
      .then(function () { btn.disabled = false; btn.textContent = 'Save event'; });
  });

  /* ── Preview and QR ── */

  function renderRight() {
    var ev = selected();
    var label = $('selected');
    label.textContent = ev ? ev.name + ' ' : 'Public site ';
    var small = document.createElement('small');
    small.textContent = ev ? '· ' + fmtDate(ev.date) + ' · code ' + ev.code : '· no event selected';
    label.appendChild(small);

    $('preview-view').hidden = state.view !== 'preview';
    $('qr-view').hidden = state.view !== 'qr';
    $('devices').hidden = state.view !== 'preview';
    if (!state.publicUrl) return;
    if (state.view === 'preview') renderPreview(ev); else renderQr(ev);
  }

  function renderPreview(ev) {
    var frame = $('frame');
    var url = checkinUrl(ev);
    if (frame.getAttribute('src') !== url) frame.setAttribute('src', url);
    fitDevice();
  }

  // Shows the page at the device's real size, scaled down to fit the stage.
  function fitDevice() {
    var d = DEVICES[state.device];
    var stage = $('preview-view');
    var scale = Math.min((stage.clientWidth - 40) / d.w, (stage.clientHeight - 40) / d.h, 1);
    var frame = $('frame');
    frame.style.width = d.w + 'px';
    frame.style.height = d.h + 'px';
    frame.style.transform = 'scale(' + scale + ')';
    $('device').style.width = Math.round(d.w * scale) + 20 + 'px';
    $('device').style.height = Math.round(d.h * scale) + 20 + 'px';
  }

  function renderQr(ev) {
    var box = $('qr-box');
    if (!ev) {
      $('qr-name').textContent = '';
      box.innerHTML = '<p class="muted">Pick an event to see its QR code.</p>';
      $('qr-url').value = '';
      $('open-link').removeAttribute('href');
      return;
    }
    var url = checkinUrl(ev);
    var qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    box.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
    $('qr-name').textContent = ev.name;
    $('qr-url').value = url;
    $('open-link').href = url;
  }

  document.querySelectorAll('#views button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.view = b.dataset.view;
      document.querySelectorAll('#views button').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderRight();
    });
  });

  document.querySelectorAll('#devices button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.device = b.dataset.device;
      document.querySelectorAll('#devices button').forEach(function (x) { x.classList.toggle('on', x === b); });
      fitDevice();
    });
  });

  $('qr-url').addEventListener('focus', function () { this.select(); });
  $('copy-btn').addEventListener('click', function () {
    var input = $('qr-url'), btn = this;
    if (!input.value) return;
    var done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy link'; }, 1500); };
    var fallback = function () { input.select(); try { document.execCommand('copy'); done(); } catch (e) {} };
    if (navigator.clipboard) navigator.clipboard.writeText(input.value).then(done, fallback); else fallback();
  });

  window.addEventListener('resize', function () { if (state.view === 'preview') fitDevice(); });

  load();
})();
</script>
</body>
</html>
